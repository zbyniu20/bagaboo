# Opcjonalne wdrożenie zbudowanej paczki (Vite, katalog dist/) na GitHub Pages. Uruchamiane RĘCZNIE (Actions > pages > Run workflow).
# Żeby zadziałało, w Settings > Pages ustaw Source na "GitHub Actions". Dopóki Pages publikuje gałąź main z katalogu głównego (obecnie), strona działa bez budowania i ten workflow nie jest potrzebny.
name: pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
