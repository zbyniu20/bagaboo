# Wdrożenie zbudowanej paczki (Vite, katalog dist/) na GitHub Pages: automatycznie po każdym pushu na main (czyli po zmergowanym PR) i ręcznie (Actions > pages > Run workflow).
# Wymaga Settings > Pages > Source = "GitHub Actions". Przed publikacją działają testy szybkie; jeśli któryś zawiedzie, nic się nie publikuje i strona zostaje w poprzedniej wersji.
# Jak wrócić do publikowania gałęzi bez budowania: Settings > Pages > Source > "Deploy from a branch" (main, katalog główny).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy szybkie przed publikacją
        run: cd tests && npm run fast
      - name: Budowanie paczki
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Chwila na pojawienie się artefaktu
        run: sleep 15   # deploy-pages pytał o artefakt ułamek sekundy po uploadzie i dostawał "Found 0 artifact(s)": GitHub nie zdążył go jeszcze pokazać
      - id: deployment
        uses: actions/deploy-pages@v4
