name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Poziomy w trzech grupach: jedna przeglądarka nie ładuje wszystkich naraz (mniej zużycia pamięci, szybciej).
    # Nowy poziom dopisz do którejś grupy (test rejestru pilnuje spójności plików, ale nie tego, czy poziom jest w CI).
    strategy:
      fail-fast: false
      matrix:
        levels:
          - lobby,levels,maze,silence,well,laundry
          - memory,lava,hospital,cemetery,catacombs,games
          - wardrobe,hideseek,statues,blindtag,swingrun,towerclimb,race,redlight
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (${{ matrix.levels }})
        run: node smoke.mjs ${{ matrix.levels }}
