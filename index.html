<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagaBoo VR - Daylight Horror Parkour</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #9db2c2; font-family: sans-serif; }
        
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #b1c6d6, #5a6e7e); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #111;
        }
        
        #lobby h1.logo { 
            font-family: 'Creepster', cursive; 
            font-size: 85px; 
            color: #880000; 
            margin-bottom: 5px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #fff, 0 0 15px rgba(255, 0, 0, 0.6);
        }

        #lobby p.subtitle { margin-bottom: 30px; color: #330000; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 340px; justify-content: space-between; }
        .form-group label { font-weight: bold; color: #222; }
        input, select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #995555; background: #f0e0e0; color: #111; width: 180px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1); }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; border: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; justify-content: center; max-width: 500px;}
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; border: 1px solid #aa0000; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-transform: uppercase; }
        
        #btnHost { background: #880000; color: #ffffff; }
        #btnJoin { background: #aa0000; color: white; }
        #btnSolo { background: #4a5c6a; color: white; border-color: #3b4d5b; }
        
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(150,0,0,0.3); }
        #btnSolo:hover { background: #5a6e7e; box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        
        button:disabled { background: #aa8888 !important; color: #ffdddd !important; border-color: #997777 !important; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status { margin-top: 25px; font-weight: bold; font-size: 16px; color: #440000; text-align: center; max-width: 400px; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #ffffff; font-weight: bold; font-size: 18px; z-index: 100; text-shadow: 2px 2px 4px black; display: none; }
        
        #VRButton { display: none !important; }
        .connected #VRButton { display: block !important; border-color: #ff0000 !important; color: #ff0000 !important; background: rgba(50,10,10,0.8) !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="lobby">
        <h1 class="logo">BagaBoo VR</h1>
        <p class="subtitle">Horror Parkour | Solid Walls Edition</p>
        
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" placeholder="Player1" value="Acrobat" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#3d2314" /></div>
        <div class="form-group">
            <label>Hat:</label>
            <select id="playerHat">
                <option value="none">None</option>
                <option value="tophat">Top Hat</option>
                <option value="cap">Baseball Cap</option>
            </select>
        </div>
        <div class="form-group">
            <label>Glasses:</label>
            <select id="playerGlasses">
                <option value="none">None</option>
                <option value="sunglasses">Sunglasses</option>
            </select>
        </div>
        <div class="form-group" style="margin-top: 15px;"><label>Room Code:</label><input type="text" id="roomCode" placeholder="e.g. nightmare" /></div>
        
        <div class="btn-group">
            <button id="btnHost">Host Game</button>
            <button id="btnJoin">Join Game</button>
            <button id="btnSolo">Play Solo</button>
        </div>
        <div id="status">Checking microphone...</div>
    </div>

    <div id="info">Connected! Climb the bleeding walls...</div>
    <div id="audio-container" style="display:none;"></div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL VARIABLES ---
        let myProfile = { name: "Acrobat", color: "#3d2314", hat: "none", glasses: "none" };
        let myStream = null;
        let audioCtx = null;

        const statusDiv = document.getElementById('status');
        
        async function initMic() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    statusDiv.innerText = "Mic access granted. Ready to play.";
                } else {
                    statusDiv.innerText = "Mic not supported (HTTPS required). Voice disabled.";
                }
            } catch (err) {
                statusDiv.innerText = "Mic access denied. Voice chat disabled.";
            }
        }
        initMic();

        // --- DARK HORROR SOUNDTRACK ---
        function initHorrorSoundtrack() {
            if(audioCtx) return; 
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            const subFilter = audioCtx.createBiquadFilter();

            subOsc.type = 'sawtooth'; subOsc.frequency.setValueAtTime(35.0, audioCtx.currentTime);
            subFilter.type = 'lowpass'; subFilter.frequency.setValueAtTime(100, audioCtx.currentTime);
            subGain.gain.setValueAtTime(0.3, audioCtx.currentTime);

            subOsc.connect(subFilter); subFilter.connect(subGain); subGain.connect(audioCtx.destination);
            subOsc.start();

            const padOsc1 = audioCtx.createOscillator(); const padOsc2 = audioCtx.createOscillator();
            const padGain = audioCtx.createGain(); const padFilter = audioCtx.createBiquadFilter();

            padOsc1.type = 'sine'; padOsc1.frequency.setValueAtTime(110, audioCtx.currentTime);
            padOsc2.type = 'triangle'; padOsc2.frequency.setValueAtTime(113, audioCtx.currentTime);

            padFilter.type = 'bandpass'; padFilter.frequency.setValueAtTime(350, audioCtx.currentTime); padFilter.Q.setValueAtTime(5, audioCtx.currentTime);
            padGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            padOsc1.connect(padFilter); padOsc2.connect(padFilter); padFilter.connect(padGain); padGain.connect(audioCtx.destination);
            padOsc1.start(); padOsc2.start();
        }

        // --- PROCEDURAL HORROR TEXTURES ---
        function createBloodyGridTexture() {
            const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#7a8894'; ctx.fillRect(0, 0, 1024, 1024); // Concrete base
            
            for(let i=0; i<30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(50,0,0,0.1)';
                ctx.fillRect(Math.random()*1024, Math.random()*1024, 2, 2);
            }

            ctx.strokeStyle = 'rgba(100, 0, 0, 0.4)'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 1024, 1024);
            ctx.lineWidth = 2;
            for(let i=0; i<=1024; i+=128) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function createBloodSplattersTexture() {
            const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#660000';
            for(let i=0; i<30; i++) {
                let x = Math.random()*1024, y = Math.random()*1024, r = Math.random()*30+10;
                ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
                for(let d=0; d<6; d++) {
                    ctx.fillRect(x-r/2+Math.random()*r, y, Math.random()*5+1, Math.random()*250+50);
                }
            }
            ctx.font = "bold 130px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("T U R N   B A C K", 512, 512);
            
            const tex = new THREE.CanvasTexture(c); tex.transparent = true; return tex;
        }

        function createEyeballTexture() {
            const c = document.createElement('canvas'); c.width=256; c.height=256; const ctx=c.getContext('2d');
            ctx.fillStyle='#eeeeee'; ctx.fillRect(0,0,256,256);
            ctx.strokeStyle='#aa0000'; ctx.lineWidth=2;
            for(let i=0; i<40; i++) {
                ctx.beginPath(); ctx.moveTo(128,128); ctx.lineTo(128 + Math.cos(i)*256, 128 + Math.sin(i)*256); ctx.stroke();
            }
            ctx.fillStyle='#440000'; ctx.beginPath(); ctx.arc(128,128,40,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000000'; ctx.beginPath(); ctx.arc(128,128,15,0,Math.PI*2); ctx.fill();
            return new THREE.CanvasTexture(c);
        }

        const scifiTex = createBloodyGridTexture();
        const bloodDecalTex = createBloodSplattersTexture();
        const eyeTex = createEyeballTexture();

        // ==========================================
        // 1. ENGINE & GRAPHICS 
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9db2c2); 
        scene.fog = new THREE.FogExp2(0x9db2c2, 0.010); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.1; 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0)); 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement); 
        const vrBtn = VRButton.createButton(renderer); document.body.appendChild(vrBtn);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9); scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(15, 30, 15); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.top = 25; dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25; dirLight.shadow.camera.right = 25;
        dirLight.shadow.bias = -0.0002; 
        scene.add(dirLight);

        // ==========================================
        // 2. PERFECT GRIP PHYSICS SETUP
        // ==========================================
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -12.0, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        
        world.defaultContactMaterial.contactEquationStiffness = 1e9;
        world.defaultContactMaterial.contactEquationRelaxation = 4;

        const physicsMat = new CANNON.Material();
        const contactMat = new CANNON.ContactMaterial(physicsMat, physicsMat, { friction: 1.0, restitution: 0.0 });
        world.addContactMaterial(contactMat);

        const GROUP_ENV = 1; const GROUP_PLAYER = 2; const GROUP_BALL = 4;
        const radius = 0.35; 
        const playerBody = new CANNON.Body({
            mass: 50, shape: new CANNON.Sphere(radius), material: physicsMat,
            position: new CANNON.Vec3(0, 2, 0), fixedRotation: true,
            collisionFilterGroup: GROUP_PLAYER, collisionFilterMask: GROUP_ENV 
        });
        world.addBody(playerBody);

        // ==========================================
        // 3. PARKOUR LOBBY BUILDING
        // ==========================================
        const obstacles = []; const trampolines = []; const ropes = []; const throwables = [];

        function addStaticBody(x, y, z, shape, meshOrGroup, isTrampoline = false) {
            const body = new CANNON.Body({ mass: 0, shape: shape, material: physicsMat, collisionFilterGroup: GROUP_ENV, collisionFilterMask: -1 });
            body.position.set(x, y, z); world.addBody(body);
            const box3 = new THREE.Box3().setFromObject(meshOrGroup);
            if (isTrampoline) trampolines.push({ box3 });
            obstacles.push({ meshOrGroup, body, box3 });
        }

        function addCrispBlock(x, y, z, w, h, d, color, edgeColor, isTrampoline = false) {
            const mat = new THREE.MeshPhysicalMaterial({ map: scifiTex, color: color, roughness: 0.6, metalness: 0.2 });
            if(isTrampoline) { mat.emissive = new THREE.Color(color); mat.emissiveIntensity = 0.5; }
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); mesh.receiveShadow = true; mesh.castShadow = true;
            
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: edgeColor, linewidth: 2 }));
            mesh.add(edges); scene.add(mesh);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)), mesh, isTrampoline);
        }

        // Walls
        addCrispBlock(0, -2.5, 0, 40, 5, 40, 0xaaaaaa, 0x880000); // Podłoga
        addCrispBlock(0, 22.5, 0, 40, 5, 40, 0xaaaaaa, 0x880000); // Sufit
        addCrispBlock(0, 10, -17.5, 40, 20, 5, 0x999999, 0x880000); // Północ
        addCrispBlock(0, 10, 17.5, 40, 20, 5, 0x999999, 0x880000);  // Południe
        addCrispBlock(-17.5, 10, 0, 5, 20, 40, 0x888888, 0x880000); // Zachód
        addCrispBlock(17.5, 10, 0, 5, 20, 40, 0x888888, 0x880000);  // Wschód

        // HORROR DECALS ON WALLS
        const decalGeo = new THREE.PlaneGeometry(25, 25);
        const decalMat = new THREE.MeshBasicMaterial({ map: bloodDecalTex, transparent: true, depthWrite: false });
        const decal1 = new THREE.Mesh(decalGeo, decalMat); decal1.position.set(0, 10, -14.9); scene.add(decal1);
        const decal2 = new THREE.Mesh(decalGeo, decalMat); decal2.position.set(0, 10, 14.9); decal2.rotation.y = Math.PI; scene.add(decal2);

        // Trampolina
        addCrispBlock(0, 0.2, 5, 3, 0.4, 3, 0xff0000, 0xffffff, true); 

        // MACABRE STAIRS
        function addScaryStep(x, y, z, size, sides) {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhysicalMaterial({ color: 0x2a1111, metalness: 0.8, roughness: 0.4 }); 
            const geo = new THREE.CylinderGeometry(size, size, 0.3, sides);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true; mesh.receiveShadow = true;
            mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 })));
            group.add(mesh);

            const spikeGeo = new THREE.ConeGeometry(size*0.6, 1.5, sides);
            const spike = new THREE.Mesh(spikeGeo, mat);
            spike.rotation.x = Math.PI; spike.position.y = -0.9;
            spike.add(new THREE.LineSegments(new THREE.EdgesGeometry(spikeGeo), new THREE.LineBasicMaterial({ color: 0xff0000 })));
            group.add(spike);

            group.position.set(x, y, z); scene.add(group);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(size*0.8, 0.15, size*0.8)), group);
        }

        for(let i=0; i<12; i++) {
            let angle = i * 0.7; let rad = 5;
            let cx = -7 + Math.cos(angle)*rad; let cz = -7 + Math.sin(angle)*rad;
            addScaryStep(cx, 1 + i*1.2, cz, 1.2, 3 + (i % 5));
        }
        addCrispBlock(-7, 1 + 12*1.2, -7, 4, 0.3, 4, 0x2a1111, 0xff0000); 

        // Monkey Bars
        addCrispBlock(8, 6, 8, 0.5, 12, 0.5, 0x1a0a0a, 0xff0000);  
        addCrispBlock(8, 6, -2, 0.5, 12, 0.5, 0x1a0a0a, 0xff0000); 
        addCrispBlock(8, 12, 3, 0.5, 0.5, 10.5, 0x1a0a0a, 0xff0000); 
        for(let i = 0; i < 5; i++) { addCrispBlock(7, 11.5, -1 + (i*2), 3, 0.2, 0.2, 0x050101, 0xff0000); }

        // BONE GRIPS
        const gripGeo = new THREE.DodecahedronGeometry(0.3);
        const gripMat = new THREE.MeshPhysicalMaterial({ color: 0xddccbb, emissive: 0x220000, metalness: 0.2, roughness: 0.8 }); 
        function addBoneGrip(x, y, z) {
            const mesh = new THREE.Mesh(gripGeo, gripMat); mesh.position.set(x, y, z); 
            mesh.rotation.set(Math.random(), Math.random(), Math.random());
            mesh.scale.set(0.6+Math.random(), 0.3+Math.random()*0.5, 0.6+Math.random());
            mesh.castShadow = true; mesh.receiveShadow = true; 
            mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(gripGeo), new THREE.LineBasicMaterial({color: 0x880000})));
            scene.add(mesh);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(0.3*mesh.scale.x, 0.3*mesh.scale.y, 0.3*mesh.scale.z)), mesh);
        }
        for(let i = 0; i < 25; i++) {
            addBoneGrip(-14.5, 2 + (i * 0.7) + Math.random(), -10 + Math.random()*5);
            addBoneGrip(14.5, 2 + (i * 0.7) + Math.random(), 10 - Math.random()*5);
        }

        // ==========================================
        // 4. REAL SWINGING ROPES & EYEBALLS
        // ==========================================
        function addGutsRope(x, y, z, height) {
            const ropeGroup = new THREE.Group();
            const mat = new THREE.MeshPhysicalMaterial({ color: 0x440000, roughness: 0.3, metalness: 0.1, clearcoat: 0.8 }); 
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, height, 16), mat);
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({color: 0xff0000, opacity: 0.5, transparent: true}));
            mesh.add(edges); mesh.castShadow = true; ropeGroup.add(mesh); scene.add(ropeGroup);
            
            const shape = new CANNON.Box(new CANNON.Vec3(0.2, height/2, 0.2));
            const body = new CANNON.Body({ 
                mass: 10, shape: shape, material: physicsMat, position: new CANNON.Vec3(x, y - height/2, z),
                linearDamping: 0.4, angularDamping: 0.4, collisionFilterGroup: GROUP_ENV, collisionFilterMask: -1 
            });
            world.addBody(body);
            const ceilingBody = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(x, y, z) });
            world.addBody(ceilingBody);
            const hinge = new CANNON.PointToPointConstraint(body, new CANNON.Vec3(0, height/2, 0), ceilingBody, new CANNON.Vec3(0,0,0));
            world.addConstraint(hinge);
            ropes.push({ mesh: ropeGroup, body: body, halfHeight: height/2 });
        }
        
        addGutsRope(4, 18, -4, 12); addGutsRope(-4, 18, 4, 12); addGutsRope(0, 15, 0, 10);
        addGutsRope(6, 15, 6, 10); addGutsRope(-8, 14, -2, 9);

        function createEyeball(id, x, y, z) {
            const mat = new THREE.MeshPhysicalMaterial({map: eyeTex, roughness: 0.1, metalness: 0.1, clearcoat: 1.0 });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), mat); mesh.castShadow = true; scene.add(mesh);
            const body = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(0.2), position: new CANNON.Vec3(x,y,z), material: physicsMat, collisionFilterGroup: GROUP_BALL, collisionFilterMask: GROUP_ENV | GROUP_BALL });
            world.addBody(body); mesh.userData = { id: id, body: body }; throwables.push(mesh);
        }
        createEyeball('ball1', 2, 1, -2); createEyeball('ball2', -2, 1, -2);

        // ==========================================
        // 5. BULLETPROOF MULTIPLAYER & SOLO MODE
        // ==========================================
        let peer = null; let hostConnection = null; let clientConnections = [];
        let isHost = false; let myPeerId = null; const GAME_PREFIX = "vr-gtag-fix2-";
        let playersState = {}; const remotePlayersVisuals = {}; let sharedObjectsState = {};
        const MAX_GUESTS = 10; 

        function onConnectionSuccess() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            document.body.classList.add('connected');
            setInterval(networkTick, 1000 / 30);
        }
        
        function playAudioStream(stream, peerId) {
            const audio = document.createElement('audio'); audio.srcObject = stream; audio.autoplay = true;
            document.getElementById('audio-container').appendChild(audio);
        }
        
        function updateProfileData() {
            myProfile.name = document.getElementById('playerName').value || "Acrobat";
            myProfile.color = document.getElementById('playerColor').value;
            myProfile.hat = document.getElementById('playerHat').value;
            myProfile.glasses = document.getElementById('playerGlasses').value;
        }

        document.getElementById('btnSolo').onclick = () => {
            updateProfileData(); initHorrorSoundtrack();
            isHost = true; myPeerId = "solo-player";
            onConnectionSuccess();
        };

        document.getElementById('btnHost').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); 
            if(!code) { alert("Please enter a Room Code."); return; }
            updateProfileData(); initHorrorSoundtrack(); 
            document.getElementById('btnHost').disabled = true; document.getElementById('btnJoin').disabled = true; document.getElementById('btnSolo').disabled = true;
            statusDiv.innerText = "Connecting to server...";
            
            try {
                isHost = true; peer = new Peer(GAME_PREFIX + code);
                const cTimeout = setTimeout(() => {
                    if(statusDiv.innerText === "Connecting to server...") {
                        statusDiv.innerText = "Server timeout. Use Solo Mode.";
                        document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; document.getElementById('btnSolo').disabled = false;
                        peer.destroy();
                    }
                }, 8000);

                peer.on('open', (id) => { clearTimeout(cTimeout); myPeerId = id; statusDiv.innerText = "Room Created! Waiting for players..."; onConnectionSuccess(); });
                peer.on('error', (err) => { clearTimeout(cTimeout); statusDiv.innerText = "Error: Room name taken or unavailable."; document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; document.getElementById('btnSolo').disabled = false; });
                peer.on('connection', (conn) => {
                    if (clientConnections.length >= MAX_GUESTS) { conn.on('open', () => { conn.send({ type: 'serverFull', message: 'Room full!' }); setTimeout(() => conn.close(), 1000); }); return; }
                    clientConnections.push(conn);
                    conn.on('data', (data) => { if (data.type === 'playerUpdate') playersState[conn.peer] = data.payload; if (data.type === 'objectMove') sharedObjectsState[data.id] = data.payload; });
                    conn.on('close', () => { clientConnections = clientConnections.filter(c => c !== conn); delete playersState[conn.peer]; removeRemotePlayerVisual(conn.peer); });
                });
                peer.on('call', (call) => { if(myStream) call.answer(myStream); call.on('stream', (remoteStream) => { playAudioStream(remoteStream, call.peer); }); });
            } catch (e) { statusDiv.innerText = "Critical Error: " + e.message; }
        };

        document.getElementById('btnJoin').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); 
            if(!code) { alert("Please enter a Room Code."); return; }
            updateProfileData(); initHorrorSoundtrack();
            document.getElementById('btnHost').disabled = true; document.getElementById('btnJoin').disabled = true; document.getElementById('btnSolo').disabled = true;
            statusDiv.innerText = "Joining...";
            
            try {
                isHost = false; peer = new Peer();
                const cTimeout = setTimeout(() => {
                    if(statusDiv.innerText === "Joining...") {
                        statusDiv.innerText = "Connection timeout. Host may be offline.";
                        document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; document.getElementById('btnSolo').disabled = false;
                        peer.destroy();
                    }
                }, 8000);

                peer.on('open', (id) => {
                    myPeerId = id; hostConnection = peer.connect(GAME_PREFIX + code);
                    hostConnection.on('open', () => { clearTimeout(cTimeout); statusDiv.innerText = "Connected!"; onConnectionSuccess(); });
                    hostConnection.on('data', (data) => {
                        if (data.type === 'serverFull') { alert(data.message); window.location.reload(); return; }
                        if (data.type === 'gameState') {
                            for (let pId in data.payload.players) { if (pId === myPeerId) continue; playersState[pId] = data.payload.players[pId]; updateRemotePlayerVisual(pId, data.payload.players[pId]); }
                            for (let pId in remotePlayersVisuals) { if (!data.payload.players[pId]) removeRemotePlayerVisual(pId); }
                            for(let objId in data.payload.objects) { if(!grabbedObject || grabbedObject.userData.id !== objId) syncObject(objId, data.payload.objects[objId]); }
                        }
                    });
                    hostConnection.on('close', () => { alert("Connection lost."); window.location.reload(); });
                    if(myStream) { const call = peer.call(GAME_PREFIX + code, myStream); call.on('stream', (remoteStream) => { playAudioStream(remoteStream, call.peer); }); }
                });
                peer.on('error', (err) => { clearTimeout(cTimeout); statusDiv.innerText = "Error: Room not found."; document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; document.getElementById('btnSolo').disabled = false; });
            } catch (e) { statusDiv.innerText = "Critical Error: " + e.message; }
        };

        // ==========================================
        // 6. AVATARS (Odłączone dłonie)
        // ==========================================
        function createNameSprite(message) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.roundRect(0,0,512,128,20); ctx.fill(); 
            ctx.strokeStyle = '#880000'; ctx.lineWidth = 6; ctx.roundRect(0,0,512,128,20); ctx.stroke(); 
            ctx.font = "bold 60px sans-serif"; ctx.fillStyle = "#111111"; ctx.textAlign = "center"; ctx.fillText(message, 256, 85);
            return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
        }

        function createAvatar(profile, isLocal) {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhysicalMaterial({ color: profile.color, roughness: 0.8, clearcoat: 0.2 });
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.35), mat); torso.castShadow = true; group.add(torso);
            let head = new THREE.Group();
            
            if (!isLocal) {
                const pSnout = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.15), new THREE.MeshPhysicalMaterial({ color: 0x222222, roughness: 0.7 }));
                pSnout.position.set(0, -0.1, -0.15); head.add(pSnout);
                const pBrow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.08), mat); pBrow.position.set(0, 0.02, -0.12); head.add(pBrow);
                if(profile.hat === 'tophat') {
                    const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2), new THREE.MeshPhysicalMaterial({color: 0x111111, roughness: 0.9}));
                    hat.position.set(0, 0.15, -0.05); head.add(hat);
                } else if (profile.hat === 'cap') {
                    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.2), new THREE.MeshPhysicalMaterial({color: 0x0055aa}));
                    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.15), new THREE.MeshPhysicalMaterial({color: 0x0055aa}));
                    cap.position.set(0, 0.1, -0.05); brim.position.set(0, 0.05, -0.2); head.add(cap, brim);
                }
                if(profile.glasses === 'sunglasses') {
                    const gl = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.06, 0.02), new THREE.MeshPhysicalMaterial({color: 0x050505, metalness:0.9, roughness:0.1}));
                    gl.position.set(0, 0.02, -0.17); head.add(gl);
                }
                const nameTag = createNameSprite(profile.name); nameTag.position.set(0, 0.4, 0); nameTag.scale.set(2, 0.5, 1); head.add(nameTag);
                group.add(head);
            }
            const createHand = () => { const h = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), mat); p.castShadow = true; h.add(p); return h; };
            let handL = createHand(); let handR = createHand(); 
            if (!isLocal) group.add(handL, handR);
            return { group, torso, head, handL, handR };
        }

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1); playerRig.add(controller2);
        const localAvatar = createAvatar(myProfile, true);
        scene.add(localAvatar.group); 
        
        // Zmiana: Dłonie zostają w Scenie, abyśmy mogli sztucznie je blokować o ściany
        scene.add(localAvatar.handL); 
        scene.add(localAvatar.handR);

        let grabbedObject = null; let grabbingController = null; let activeRopeConstraint = null;

        function onSqueezeStart(event) {
            const ctrl = event.target; 
            const isLeft = (ctrl === controller1);
            const handMesh = isLeft ? localAvatar.handL : localAvatar.handR;
            const pos = new THREE.Vector3(); handMesh.getWorldPosition(pos);
            
            for(let ball of throwables) { 
                if(ball.position.distanceTo(pos) < 0.3) { 
                    grabbedObject = ball; grabbingController = ctrl; 
                    grabbedObject.userData.body.type = CANNON.Body.KINEMATIC; grabbedObject.userData.body.velocity.set(0,0,0); grabbedObject.userData.body.angularVelocity.set(0,0,0); return; 
                } 
            }
            if(!activeRopeConstraint) {
                for(let rope of ropes) {
                    const localY = pos.y - rope.body.position.y;
                    if(localY < rope.halfHeight && localY > -rope.halfHeight) {
                        const hDist = Math.sqrt(Math.pow(pos.x - rope.body.position.x, 2) + Math.pow(pos.z - rope.body.position.z, 2));
                        if(hDist < 0.8) {
                            const localPlayerOffset = new CANNON.Vec3(playerBody.position.x - pos.x, playerBody.position.y - pos.y, playerBody.position.z - pos.z);
                            activeRopeConstraint = new CANNON.PointToPointConstraint(playerBody, localPlayerOffset, rope.body, new CANNON.Vec3(0, localY, 0));
                            world.addConstraint(activeRopeConstraint); return;
                        }
                    }
                }
            }
        }

        function onSqueezeEnd(event) {
            if(activeRopeConstraint && (event.target === controller1 || event.target === controller2)) { 
                world.removeConstraint(activeRopeConstraint); activeRopeConstraint = null; 
            }
            if(grabbedObject && grabbingController === event.target) {
                grabbedObject.userData.body.type = CANNON.Body.DYNAMIC;
                const throwDir = new THREE.Vector3(0,0,-1).applyQuaternion(event.target.quaternion).multiplyScalar(15);
                grabbedObject.userData.body.velocity.copy(new CANNON.Vec3(throwDir.x, throwDir.y + 5, throwDir.z));
                if(!isHost && hostConnection) hostConnection.send({ type: 'objectMove', id: grabbedObject.userData.id, payload: { p: grabbedObject.position.toArray(), q: grabbedObject.quaternion.toArray(), v: [throwDir.x, throwDir.y+5, throwDir.z] }});
                grabbedObject = null; grabbingController = null;
            }
        }
        controller1.addEventListener('squeezestart', onSqueezeStart); controller1.addEventListener('squeezeend', onSqueezeEnd);
        controller2.addEventListener('squeezestart', onSqueezeStart); controller2.addEventListener('squeezeend', onSqueezeEnd);

        function updateRemotePlayerVisual(id, state) {
            if (!remotePlayersVisuals[id]) { const newAvatar = createAvatar(state.profile, false); scene.add(newAvatar.group); remotePlayersVisuals[id] = newAvatar; }
            const p = remotePlayersVisuals[id];
            p.head.position.fromArray(state.head.p); p.head.quaternion.fromArray(state.head.q);
            p.handL.position.fromArray(state.h1.p); p.handL.quaternion.fromArray(state.h1.q);
            p.handR.position.fromArray(state.h2.p); p.handR.quaternion.fromArray(state.h2.q);
            const euler = new THREE.Euler().setFromQuaternion(p.head.quaternion, "YXZ");
            p.torso.position.copy(p.head.position).add(new THREE.Vector3(0, -0.35, 0)); p.torso.rotation.set(0, euler.y, 0);
        }
        function removeRemotePlayerVisual(id) { if (remotePlayersVisuals[id]) { scene.remove(remotePlayersVisuals[id].group); delete remotePlayersVisuals[id]; } }
        function syncObject(id, data) {
            const ball = throwables.find(b => b.userData.id === id);
            if(ball && ball.userData.body.type === CANNON.Body.DYNAMIC) {
                ball.userData.body.position.set(data.p[0], data.p[1], data.p[2]); ball.userData.body.quaternion.set(data.q[0], data.q[1], data.q[2], data.q[3]); ball.userData.body.velocity.set(data.v[0], data.v[1], data.v[2]);
            }
        }
        
        function networkTick() {
            if (!myPeerId || myPeerId === "solo-player") return;
            const hp = new THREE.Vector3(); const hq = new THREE.Quaternion(); camera.getWorldPosition(hp); camera.getWorldQuaternion(hq);
            const l1p = new THREE.Vector3(); const l1q = new THREE.Quaternion(); localAvatar.handL.getWorldPosition(l1p); localAvatar.handL.getWorldQuaternion(l1q);
            const l2p = new THREE.Vector3(); const l2q = new THREE.Quaternion(); localAvatar.handR.getWorldPosition(l2p); localAvatar.handR.getWorldQuaternion(l2q);
            const myState = { profile: myProfile, head: { p: hp.toArray(), q: hq.toArray() }, h1: { p: l1p.toArray(), q: l1q.toArray() }, h2: { p: l2p.toArray(), q: l2q.toArray() } };
            
            if(isHost) {
                for(let ball of throwables) { sharedObjectsState[ball.userData.id] = { p: ball.userData.body.position.toArray(), q: ball.userData.body.quaternion.toArray(), v: ball.userData.body.velocity.toArray() }; }
                playersState[myPeerId] = myState;
                clientConnections.forEach(c => { if(c.open) c.send({ type: 'gameState', payload: { players: playersState, objects: sharedObjectsState } }); });
            } else if (hostConnection && hostConnection.open) { hostConnection.send({ type: 'playerUpdate', payload: myState }); }
        }

        // ==========================================
        // 7. MOVEMENT, ANTI-PHASING & HAND CLAMP
        // ==========================================
        let prevLocalPos1 = new THREE.Vector3(); let prevLocalPos2 = new THREE.Vector3();
        const clock = new THREE.Clock();

        // System zatrzymywania rąk na przeszkodach (nie wejdą do środka)
        function clampHandVisual(controller, handMesh) {
            const pos = new THREE.Vector3(); controller.getWorldPosition(pos);
            const quat = new THREE.Quaternion(); controller.getWorldQuaternion(quat);
            
            handMesh.position.copy(pos);
            handMesh.quaternion.copy(quat);
            
            const hRad = 0.08;
            for(let obs of obstacles) {
                const box = obs.box3;
                if (handMesh.position.x > box.min.x - hRad && handMesh.position.x < box.max.x + hRad &&
                    handMesh.position.y > box.min.y - hRad && handMesh.position.y < box.max.y + hRad &&
                    handMesh.position.z > box.min.z - hRad && handMesh.position.z < box.max.z + hRad) {
                    
                    const px1 = handMesh.position.x - (box.min.x - hRad);
                    const px2 = (box.max.x + hRad) - handMesh.position.x;
                    const py1 = handMesh.position.y - (box.min.y - hRad);
                    const py2 = (box.max.y + hRad) - handMesh.position.y;
                    const pz1 = handMesh.position.z - (box.min.z - hRad);
                    const pz2 = (box.max.z + hRad) - handMesh.position.z;
                    
                    const min = Math.min(px1, px2, py1, py2, pz1, pz2);
                    if (min === px1) handMesh.position.x = box.min.x - hRad;
                    else if (min === px2) handMesh.position.x = box.max.x + hRad;
                    else if (min === py1) handMesh.position.y = box.min.y - hRad;
                    else if (min === py2) handMesh.position.y = box.max.y + hRad;
                    else if (min === pz1) handMesh.position.z = box.min.z - hRad;
                    else if (min === pz2) handMesh.position.z = box.max.z + hRad;
                }
            }
        }

        function handleMovement(controller, handMesh, prevLocalPos) {
            const currentLocalPos = controller.position.clone();
            
            if (prevLocalPos.lengthSq() > 0 && !activeRopeConstraint) {
                const deltaLocalPos = new THREE.Vector3().subVectors(currentLocalPos, prevLocalPos);
                const handWorldPos = new THREE.Vector3(); 
                handMesh.getWorldPosition(handWorldPos);

                let isTouchingGround = false;
                let isTouchingWall = false;
                
                if (handWorldPos.y <= 0.25) {
                    isTouchingGround = true;
                } else {
                    for(let obs of obstacles) {
                        if (obs.box3.distanceToPoint(handWorldPos) <= 0.3) { 
                            if (handWorldPos.y > obs.box3.min.y + 0.15) { isTouchingWall = true; } else { isTouchingGround = true; }
                            break; 
                        }
                    }
                }

                for(let t of trampolines) {
                    if (t.box3.distanceToPoint(handWorldPos) <= 0.25) {
                        playerBody.velocity.y = 12; isTouchingGround = false; isTouchingWall = false; break;
                    }
                }

                if ((isTouchingGround || isTouchingWall) && deltaLocalPos.lengthSq() > 0) {
                    const deltaWorld = deltaLocalPos.clone().applyQuaternion(playerRig.quaternion);
                    if(deltaWorld.length() > 0.4) deltaWorld.normalize().multiplyScalar(0.4);

                    let pushForceXZ = -650; 
                    let pushForceY = -650;

                    if (isTouchingWall) {
                        pushForceY = -800; pushForceXZ = -700;
                    }

                    playerBody.applyImpulse(
                        new CANNON.Vec3(deltaWorld.x * pushForceXZ, deltaWorld.y * pushForceY, deltaWorld.z * pushForceXZ), 
                        playerBody.position
                    );
                }
            }
            prevLocalPos.copy(currentLocalPos);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.1); 
            world.step(1/90, dt, 10); 

            // --- ANTI-PHASING (BLOKADA PRZENIKANIA CIAŁA) ---
            const pVec = playerBody.position;
            for(let obs of obstacles) {
                const box = obs.box3;
                if (pVec.x > box.min.x - radius && pVec.x < box.max.x + radius &&
                    pVec.y > box.min.y - radius && pVec.y < box.max.y + radius &&
                    pVec.z > box.min.z - radius && pVec.z < box.max.z + radius) {
                    
                    const px1 = pVec.x - (box.min.x - radius);
                    const px2 = (box.max.x + radius) - pVec.x;
                    const py1 = pVec.y - (box.min.y - radius);
                    const py2 = (box.max.y + radius) - pVec.y;
                    const pz1 = pVec.z - (box.min.z - radius);
                    const pz2 = (box.max.z + radius) - pVec.z;
                    
                    const min = Math.min(px1, px2, py1, py2, pz1, pz2);
                    if (min === px1) { playerBody.position.x = box.min.x - radius; playerBody.velocity.x = 0; }
                    else if (min === px2) { playerBody.position.x = box.max.x + radius; playerBody.velocity.x = 0; }
                    else if (min === py1) { playerBody.position.y = box.min.y - radius; playerBody.velocity.y = 0; }
                    else if (min === py2) { playerBody.position.y = box.max.y + radius; playerBody.velocity.y = 0; }
                    else if (min === pz1) { playerBody.position.z = box.min.z - radius; playerBody.velocity.z = 0; }
                    else if (min === pz2) { playerBody.position.z = box.max.z + radius; playerBody.velocity.z = 0; }
                }
            }
            
            // Twarda granica pokoju
            if(playerBody.position.x < -14.6) { playerBody.position.x = -14.6; playerBody.velocity.x = 0; }
            if(playerBody.position.x > 14.6) { playerBody.position.x = 14.6; playerBody.velocity.x = 0; }
            if(playerBody.position.z < -14.6) { playerBody.position.z = -14.6; playerBody.velocity.z = 0; }
            if(playerBody.position.z > 14.6) { playerBody.position.z = 14.6; playerBody.velocity.z = 0; }
            if(playerBody.position.y < radius) { playerBody.position.y = radius; if(playerBody.velocity.y < 0) playerBody.velocity.y = 0; }
            if(playerBody.position.y > 19.6) { playerBody.position.y = 19.6; if(playerBody.velocity.y > 0) playerBody.velocity.y = 0; }
            
            // ANTI-SLIP PHYSICS: Hard brake based on actual physics contacts
            let isGrounded = false;
            for (let i = 0; i < world.contacts.length; i++) {
                const c = world.contacts[i];
                if (c.bi === playerBody || c.bj === playerBody) {
                    let ni = c.ni; 
                    if (c.bi === playerBody && ni.y < -0.5) isGrounded = true; 
                    else if (c.bj === playerBody && ni.y > 0.5) isGrounded = true;
                }
            }
            if (isGrounded && !activeRopeConstraint) {
                playerBody.velocity.x *= 0.3; // Mocne wytracanie prędkości
                playerBody.velocity.z *= 0.3;
            }

            const speedSq = playerBody.velocity.lengthSquared();
            if(speedSq > 144) { playerBody.velocity.scale(12 / Math.sqrt(speedSq), playerBody.velocity); }

            if (renderer.xr.isPresenting) {
                // BLOKADA PRZENIKANIA DŁONI PRZEZ ŚCIANY
                clampHandVisual(controller1, localAvatar.handL);
                clampHandVisual(controller2, localAvatar.handR);

                handleMovement(controller1, localAvatar.handL, prevLocalPos1); 
                handleMovement(controller2, localAvatar.handR, prevLocalPos2);
            }
            
            if(grabbedObject && grabbingController) {
                const ctrlPos = new THREE.Vector3(); grabbingController.getWorldPosition(ctrlPos); grabbedObject.userData.body.position.copy(ctrlPos);
            }
            for(let ball of throwables) { ball.position.copy(ball.userData.body.position); ball.quaternion.copy(ball.userData.body.quaternion); }
            
            for(let rope of ropes) {
                rope.mesh.position.copy(rope.body.position); rope.mesh.quaternion.copy(rope.body.quaternion);
            }

            const camLocalPos = camera.position.clone();
            const gorillaStanceOffset = 0.6;

            playerRig.position.set(
                playerBody.position.x - camLocalPos.x,
                playerBody.position.y - radius - gorillaStanceOffset,
                playerBody.position.z - camLocalPos.z
            );

            const camWorldPos = new THREE.Vector3(); camera.getWorldPosition(camWorldPos);
            const camWorldQuat = new THREE.Quaternion(); camera.getWorldQuaternion(camWorldQuat);
            const euler = new THREE.Euler().setFromQuaternion(camWorldQuat, "YXZ");
            
            localAvatar.torso.position.copy(camWorldPos).add(new THREE.Vector3(0, -0.35, 0));
            localAvatar.torso.rotation.set(0, euler.y, 0);

            renderer.render(scene, camera);
        });
    </script>
