<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVR Gorilla Tag - High Contrast FullBody</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a2a20, #0a0a08); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #d4d4aa;
        }
        #lobby h1 { margin-bottom: 5px; font-size: 38px; text-shadow: 0 0 10px #ffffaa; text-transform: uppercase; letter-spacing: 3px; }
        #lobby p.subtitle { margin-bottom: 25px; color: #aaa; font-size: 14px; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 340px; justify-content: space-between; color: white;}
        input, select { padding: 10px; font-size: 16px; border-radius: 2px; border: 1px solid #aa8822; background: #111; color: white; width: 180px; }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { padding: 15px 25px; font-size: 16px; font-weight: bold; border: 1px solid #aa8822; border-radius: 2px; cursor: pointer; background: #111; color: #aa8822; text-transform: uppercase; }
        button:hover { background: #332200; box-shadow: 0 0 15px #aa8822; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; font-size: 16px; color: #ffeb3b; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #fff; font-weight: bold; z-index: 100; display: none; text-shadow: 1px 1px 3px #000; }
        #VRButton { display: none !important; }
        .connected #VRButton { display: block !important; border: 1px solid #aa8822 !important; background: #111 !important; color: white !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="lobby">
        <h1>Gorilla Tag: The Maze</h1>
        <p class="subtitle">High Contrast | Full Body VR | Fixed Movement</p>
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" value="Survivor" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#8B4513" /></div>
        <div class="form-group"><label>Room Code:</label><input type="text" id="roomCode" placeholder="e.g. tag1" /></div>
        <div class="btn-group">
            <button id="btnHost">Host Game</button>
            <button id="btnJoin">Join Game</button>
        </div>
        <div id="status">Initializing...</div>
    </div>
    <div id="info">Connected! Click "ENTER VR". Push off the grid floor to move. Look down to see your body.</div>
    <div id="audio-container" style="display:none;"></div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        let myProfile = { name: "Survivor", color: "#8B4513", id: null };
        let myStream = null;
        const statusDiv = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
            myStream = s; statusDiv.innerText = "Mic ready. Enter Room Code.";
        }).catch(() => { statusDiv.innerText = "Mic denied. Enter Room Code."; });

        // ==========================================
        // 1. ENGINE & RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x11161c);
        scene.fog = new THREE.FogExp2(0x11161c, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.xr.enabled = true;
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.8));

        const flashlight = new THREE.SpotLight(0xfff5b6, 100, 40, Math.PI / 3, 0.5, 1.5);
        camera.add(flashlight);
        const flashTarget = new THREE.Object3D(); flashTarget.position.set(0, 0, -1); camera.add(flashTarget);
        flashlight.target = flashTarget;

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -12.0, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.allowSleep = true;
        const physicsMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(physicsMat, physicsMat, { friction: 0.8, restitution: 0.0 }));

        const radius = 0.35;
        const playerBody = new CANNON.Body({
            mass: 50, shape: new CANNON.Sphere(radius), material: physicsMat,
            position: new CANNON.Vec3(0, radius, 0), linearDamping: 0.15, fixedRotation: true, allowSleep: false
        });
        world.addBody(playerBody);

        // ==========================================
        // 2. PROCEDURAL HIGH-CONTRAST TEXTURES
        // ==========================================
        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 512, 512);
            for (let i = 0; i <= 512; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(16, 16);
            return tex;
        }
        const floorGridTex = createGridTexture();

        // Audio & Jumpscare
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playScarySound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'spawn') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 2.5);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 4.5);
                osc.start(); osc.stop(audioCtx.currentTime + 4.5);
            } else if (type === 'jumpscare') {
                osc.type = 'square'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(1.5, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        const jsCanvas = document.createElement('canvas'); jsCanvas.width = 256; jsCanvas.height = 256;
        const jsCtx = jsCanvas.getContext('2d');
        jsCtx.fillStyle = '#000'; jsCtx.fillRect(0, 0, 256, 256);
        jsCtx.fillStyle = '#ff0055'; jsCtx.beginPath(); jsCtx.arc(80, 100, 25, 0, Math.PI * 2); jsCtx.arc(176, 100, 25, 0, Math.PI * 2); jsCtx.fill();
        const jumpscareMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(jsCanvas), transparent: true, opacity: 0, depthTest: false }));
        jumpscareMesh.position.set(0, 0, -0.5); camera.add(jumpscareMesh);

        function createLabelSprite(text, bgColor = "#000", textColor = "#00ffcc") {
            const c = document.createElement('canvas'); c.width = 256; c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 64);
            ctx.strokeStyle = textColor; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 256, 64);
            ctx.font = "bold 28px Courier New"; ctx.fillStyle = textColor; ctx.textAlign = "center"; ctx.fillText(text, 128, 42);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
            sp.scale.set(1.5, 0.375, 1);
            return sp;
        }

        // ==========================================
        // 3. HIGH-CONTRAST WORLD (LOBBY + MAZE)
        // ==========================================
        const lobbyGroup = new THREE.Group(); scene.add(lobbyGroup);
        const lobbyObstacles = []; const lobbyTrampolines = []; const portals = []; const lobbyRopes = [];
        const lobbyCompoundBody = new CANNON.Body({ mass: 0, material: physicsMat });
        world.addBody(lobbyCompoundBody);

        const mats = {
            wall: new THREE.MeshLambertMaterial({ color: 0x334155 }),
            floor: new THREE.MeshLambertMaterial({ map: floorGridTex }),
            wood: new THREE.MeshLambertMaterial({ color: 0xd97706 }),
            grip: new THREE.MeshLambertMaterial({ color: 0x10b981 }),
            pillar: new THREE.MeshLambertMaterial({ color: 0x475569 }),
            trampoline: new THREE.MeshBasicMaterial({ color: 0xfbbf24 }),
            mezzanine: new THREE.MeshLambertMaterial({ color: 0x1e293b }),
            rope: new THREE.MeshLambertMaterial({ color: 0x059669 })
        };

        function addLobbyBlock(x, y, z, w, h, d, mat, isTrampoline = false) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); lobbyGroup.add(mesh);
            lobbyCompoundBody.addShape(new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)), new CANNON.Vec3(x, y, z));
            const box3 = new THREE.Box3(new THREE.Vector3(x - w / 2, y - h / 2, z - d / 2), new THREE.Vector3(x + w / 2, y + h / 2, z + d / 2));
            if (isTrampoline) lobbyTrampolines.push(box3);
            else lobbyObstacles.push(box3);
        }

        addLobbyBlock(0, -0.5, 0, 20, 1, 20, mats.floor);
        addLobbyBlock(0, 16.5, 0, 20, 1, 20, mats.wall);
        addLobbyBlock(0, 8, -10.5, 21, 16, 1, mats.wall);
        addLobbyBlock(0, 8, 10.5, 21, 16, 1, mats.wall);
        addLobbyBlock(-10.5, 8, 0, 1, 16, 21, mats.wall);
        addLobbyBlock(10.5, 8, 0, 1, 16, 21, mats.wall);

        addLobbyBlock(0, 6.75, 0, 2.2, 13.5, 2.2, mats.pillar);
        for (let i = 0; i < 20; i++) {
            const angle = (i * Math.PI) / 2;
            addLobbyBlock(Math.cos(angle) * 1.6, 0.8 + i * 0.65, Math.sin(angle) * 1.6, 1.0, 0.3, 1.0, mats.grip);
        }

        addLobbyBlock(-7, 0.2, -7, 2.5, 0.4, 2.5, mats.trampoline, true);
        addLobbyBlock(7, 0.2, 7, 2.5, 0.4, 2.5, mats.trampoline, true);
        addLobbyBlock(-7, 0.2, 7, 2.5, 0.4, 2.5, mats.trampoline, true);
        addLobbyBlock(7, 0.2, -7, 2.5, 0.4, 2.5, mats.trampoline, true);

        const parkourPath = [
            [-9, 1.5, 7], [-9, 3.0, 3], [-9, 4.5, -1], [-9, 6.0, -5],
            [-6, 7.5, -9], [-2, 9.0, -9], [2, 10.5, -9], [6, 12.0, -9],
            [9, 13.0, -6], [9, 13.5, -2], [9, 14.0, 2]
        ];
        parkourPath.forEach(([x, y, z]) => addLobbyBlock(x, y, z, 2.0, 0.4, 2.0, mats.wood));

        function addLobbyRope(x, z) {
            const rMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 12), mats.rope);
            rMesh.position.set(x, 10, z); lobbyGroup.add(rMesh);
            lobbyRopes.push(rMesh);
        }
        addLobbyRope(-4, -4); addLobbyRope(4, 4); addLobbyRope(-4, 4);

        addLobbyBlock(0, 14, 8.5, 20, 0.5, 3, mats.mezzanine);
        addLobbyBlock(0, 14, -8.5, 20, 0.5, 3, mats.mezzanine);
        addLobbyBlock(-8.5, 14, 0, 3, 0.5, 14, mats.mezzanine);
        addLobbyBlock(8.5, 14, 0, 3, 0.5, 14, mats.mezzanine);

        for (let i = 1; i <= 10; i++) {
            const isActive = (i === 1);
            const row = i <= 5 ? 0 : 1;
            const col = (i - 1) % 5;
            const px = -6 + col * 3;
            const pz = row === 0 ? 9.2 : -9.2;
            const pMesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 0.6), new THREE.MeshBasicMaterial({ color: isActive ? 0x00ffcc : 0xaa2255, wireframe: !isActive }));
            pMesh.position.set(px, 15.2, pz); lobbyGroup.add(pMesh);
            portals.push({ level: i, active: isActive, box3: new THREE.Box3().setFromObject(pMesh) });
        }

        // --- MAZE (Level 1) ---
        const mazeGroup = new THREE.Group(); scene.add(mazeGroup); mazeGroup.visible = false;
        const mazeObstacles = [];
        const mazeCompoundBody = new CANNON.Body({ mass: 0, material: physicsMat });

        const MAZE_OFFSET_X = 500;
        const GRID_SIZE = 14; const CELL_SIZE = 5;
        let seed = 12345;
        function sRand() { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }

        const grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill({ v: false, r: true, b: true }));
        function carve(cx, cy) {
            grid[cy][cx] = { ...grid[cy][cx], v: true };
            const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]].sort(() => sRand() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = cx + dx, ny = cy + dy;
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !grid[ny][nx].v) {
                    if (dx === 1) grid[cy][cx].r = false; else if (dx === -1) grid[ny][nx].r = false;
                    if (dy === 1) grid[cy][cx].b = false; else if (dy === -1) grid[ny][nx].b = false;
                    carve(nx, ny);
                }
            }
        }
        carve(0, 0);

        const wallGeo = new THREE.BoxGeometry(CELL_SIZE + 0.6, 8, 0.6);
        const backroomsMat = new THREE.MeshLambertMaterial({ color: 0xeab308 });
        const wallInst = new THREE.InstancedMesh(wallGeo, backroomsMat, GRID_SIZE * GRID_SIZE * 2 + 60);
        let wCount = 0; const dummy = new THREE.Object3D();

        function addMazeWall(x, z, rotY) {
            dummy.position.set(x, 4, z); dummy.rotation.set(0, rotY, 0); dummy.updateMatrix();
            wallInst.setMatrixAt(wCount++, dummy.matrix);
            const halfW = rotY ? 0.3 : (CELL_SIZE + 0.6) / 2;
            const halfD = rotY ? (CELL_SIZE + 0.6) / 2 : 0.3;
            mazeCompoundBody.addShape(new CANNON.Box(new CANNON.Vec3(halfW, 4, halfD)), new CANNON.Vec3(x, 4, z));
            mazeObstacles.push(new THREE.Box3(new THREE.Vector3(x - halfW, 0, z - halfD), new THREE.Vector3(x + halfW, 8, z + halfD)));
        }

        for (let i = 0; i < GRID_SIZE; i++) {
            addMazeWall(MAZE_OFFSET_X + i * CELL_SIZE, -CELL_SIZE / 2, 0);
            addMazeWall(MAZE_OFFSET_X - CELL_SIZE / 2, i * CELL_SIZE, Math.PI / 2);
        }

        const arrowGeo = new THREE.PlaneGeometry(1.5, 1.5);
        const arrowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                let px = MAZE_OFFSET_X + x * CELL_SIZE; let pz = y * CELL_SIZE;
                if (grid[y][x].r) addMazeWall(px + CELL_SIZE / 2, pz, Math.PI / 2);
                if (grid[y][x].b) addMazeWall(px, pz + CELL_SIZE / 2, 0);
                if ((x + y) % 3 === 0 && (x < GRID_SIZE - 1 || y < GRID_SIZE - 1)) {
                    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
                    arrow.rotation.x = -Math.PI / 2; arrow.position.set(px, 0.02, pz);
                    arrow.rotation.z = Math.atan2((GRID_SIZE - 1 - y), (GRID_SIZE - 1 - x));
                    mazeGroup.add(arrow);
                }
            }
        }
        wallInst.count = wCount; mazeGroup.add(wallInst);

        const mFloor = new THREE.Mesh(new THREE.BoxGeometry(75, 1, 75), new THREE.MeshLambertMaterial({ map: floorGridTex }));
        mFloor.position.set(MAZE_OFFSET_X + 32.5, -0.5, 32.5); mazeGroup.add(mFloor);
        mazeCompoundBody.addShape(new CANNON.Box(new CANNON.Vec3(37.5, 0.5, 37.5)), new CANNON.Vec3(MAZE_OFFSET_X + 32.5, -0.5, 32.5));
        mazeObstacles.push(new THREE.Box3(new THREE.Vector3(MAZE_OFFSET_X - 5, -1, -5), new THREE.Vector3(MAZE_OFFSET_X + 70, 0, 70)));

        const mCeil = new THREE.Mesh(new THREE.BoxGeometry(75, 1, 75), new THREE.MeshLambertMaterial({ color: 0x333322 }));
        mCeil.position.set(MAZE_OFFSET_X + 32.5, 8.5, 32.5); mazeGroup.add(mCeil);
        mazeCompoundBody.addShape(new CANNON.Box(new CANNON.Vec3(37.5, 0.5, 37.5)), new CANNON.Vec3(MAZE_OFFSET_X + 32.5, 8.5, 32.5));

        const exitMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 3), new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true }));
        exitMesh.position.set(MAZE_OFFSET_X + 13 * CELL_SIZE, 2, 13 * CELL_SIZE); mazeGroup.add(exitMesh);
        const mazeExitBox = new THREE.Box3().setFromObject(exitMesh);

        // Monster
        const monsterGroup = new THREE.Group();
        const mMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const limbs = [];
        for (let i = 0; i < 12; i++) {
            const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.0), mMat);
            limb.position.set((Math.random() - 0.5) * 0.8, 1.4, (Math.random() - 0.5) * 0.8);
            monsterGroup.add(limb); limbs.push(limb);
        }
        scene.add(monsterGroup); monsterGroup.visible = false;

        let currentZone = 'lobby';
        let activeObstacles = lobbyObstacles;
        let levelStartTime = 0;
        const playerPathHistory = [];
        let monsterPathIndex = 0;
        let gameStateMaze = 'maze_safe';

        function switchZone(toZone) {
            playerPathHistory.length = 0; isGrabbingRope = false;
            if (toZone === 'maze') {
                world.removeBody(lobbyCompoundBody);
                world.addBody(mazeCompoundBody);
                lobbyGroup.visible = false;
                mazeGroup.visible = true;
                activeObstacles = mazeObstacles;
                currentZone = 'maze';
                playerBody.position.set(MAZE_OFFSET_X, radius, 0);
                playerBody.velocity.set(0, 0, 0);
                gameStateMaze = 'maze_safe';
                levelStartTime = clock.getElapsedTime();
            } else {
                world.removeBody(mazeCompoundBody);
                world.addBody(lobbyCompoundBody);
                mazeGroup.visible = false;
                lobbyGroup.visible = true;
                monsterGroup.visible = false;
                activeObstacles = lobbyObstacles;
                currentZone = 'lobby';
                playerBody.position.set(0, radius, 0);
                playerBody.velocity.set(0, 0, 0);
            }
        }

        function triggerJumpscare() {
            jumpscareMesh.material.opacity = 1; playScarySound('jumpscare');
            setTimeout(() => { jumpscareMesh.material.opacity = 0; switchZone('lobby'); }, 900);
        }

        // ==========================================
        // 4. FULL BODY AVATARS & MULTIPLAYER
        // ==========================================
        function createAvatar(color, name, isLocal) {
            const g = new THREE.Group();
            const hMat = new THREE.MeshLambertMaterial({ color: color });
            
            // Torso (Widoczne po spojrzeniu w dół)
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, 0.3), hMat);
            torso.position.set(0, -0.3, -0.1);
            g.add(torso);

            const head = new THREE.Group();
            if (!isLocal) {
                const face = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), hMat); head.add(face);
                const lbl = createLabelSprite(name || "Player"); lbl.position.set(0, 0.35, 0); head.add(lbl);
                g.add(head);
            }
            
            const handL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), hMat);
            const handR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), hMat);
            if (!isLocal) g.add(handL, handR);

            return { group: g, torso, head, handL, handR };
        }

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1); playerRig.add(controller2);
        
        const localAvatar = createAvatar(myProfile.color, myProfile.name, true);
        camera.add(localAvatar.group); // Przypięcie do kamery, aby ciało zawsze było pod Tobą w polu widzenia!

        let isGrabbingRope = false;
        function onSqueezeStart(e) {
            const ctrl = e.target; const pos = new THREE.Vector3(); ctrl.getWorldPosition(pos);
            for (let rope of lobbyRopes) {
                if (rope.position.distanceTo(pos) < 2.0 && currentZone === 'lobby') {
                    isGrabbingRope = true; playerBody.velocity.set(0, 0, 0); break;
                }
            }
        }
        function onSqueezeEnd() { isGrabbingRope = false; }
        controller1.addEventListener('squeezestart', onSqueezeStart); controller1.addEventListener('squeezeend', onSqueezeEnd);
        controller2.addEventListener('squeezestart', onSqueezeStart); controller2.addEventListener('squeezeend', onSqueezeEnd);

        let peer = null; let hostConn = null; let clients = []; let isHost = false;
        const playersState = {}; const remoteVisuals = {};

        function updateRemoteVisuals(id, st) {
            if (!remoteVisuals[id]) {
                remoteVisuals[id] = createAvatar(st.c, st.n, false);
                scene.add(remoteVisuals[id].group);
            }
            const v = remoteVisuals[id];
            v.head.position.fromArray(st.h);
            v.torso.position.set(st.h[0], st.h[1] - 0.35, st.h[2]);
            v.torso.rotation.y = st.ry || 0;
            v.handL.position.fromArray(st.l);
            v.handR.position.fromArray(st.r);
        }

        function playAudioStream(stream) {
            const audio = document.createElement('audio'); audio.srcObject = stream; audio.autoplay = true;
            document.getElementById('audio-container').appendChild(audio);
        }

        function startNetworkLoop() {
            document.body.classList.add('connected');
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            localAvatar.torso.material.color.set(myProfile.color);

            setInterval(() => {
                if (!myProfile.id) return;
                const hp = new THREE.Vector3(); const lp = new THREE.Vector3(); const rp = new THREE.Vector3();
                camera.getWorldPosition(hp); controller1.getWorldPosition(lp); controller2.getWorldPosition(rp);
                const ry = new THREE.Euler().setFromQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()), "YXZ").y;
                const mySt = { n: myProfile.name, c: myProfile.color, h: hp.toArray(), l: lp.toArray(), r: rp.toArray(), ry: ry };

                if (isHost) {
                    playersState[myProfile.id] = mySt;
                    clients.forEach(conn => { if (conn.open) conn.send({ type: 'state', players: playersState }); });
                } else if (hostConn && hostConn.open) {
                    hostConn.send({ type: 'update', state: mySt });
                }
            }, 50);
        }

        document.getElementById('btnHost').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); if (!code) return alert("Enter Room Code!");
            myProfile.name = document.getElementById('playerName').value || "Host";
            myProfile.color = document.getElementById('playerColor').value;
            isHost = true; peer = new Peer("vr-fullbody-" + code);
            peer.on('open', id => { myProfile.id = id; startNetworkLoop(); });
            peer.on('connection', conn => {
                clients.push(conn);
                conn.on('data', d => { if (d.type === 'update') { playersState[conn.peer] = d.state; updateRemoteVisuals(conn.peer, d.state); } });
            });
            peer.on('call', call => { if (myStream) call.answer(myStream); call.on('stream', s => playAudioStream(s)); });
        };

        document.getElementById('btnJoin').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); if (!code) return alert("Enter Room Code!");
            myProfile.name = document.getElementById('playerName').value || "Guest";
            myProfile.color = document.getElementById('playerColor').value;
            isHost = false; peer = new Peer();
            peer.on('open', id => {
                myProfile.id = id; hostConn = peer.connect("vr-fullbody-" + code);
                hostConn.on('open', () => startNetworkLoop());
                hostConn.on('data', d => { if (d.type === 'state') { for (let pid in d.players) { if (pid !== myProfile.id) updateRemoteVisuals(pid, d.players[pid]); } } });
                if (myStream) { const call = peer.call("vr-fullbody-" + code, myStream); call.on('stream', s => playAudioStream(s)); }
            });
        };

        // ==========================================
        // 5. MAIN LOOP
        // ==========================================
        const prevLocal1 = new THREE.Vector3(); const prevLocal2 = new THREE.Vector3();
        const tmpDelta1 = new THREE.Vector3(); const tmpDelta2 = new THREE.Vector3();
        const tmpHandWorld1 = new THREE.Vector3(); const tmpHandWorld2 = new THREE.Vector3();
        const clock = new THREE.Clock();

        function processMovement(ctrl, handMesh, prevPos) {
            const currPos = ctrl.position.clone();
            if (prevPos.lengthSq() > 0 && !isGrabbingRope) {
                const deltaLocal = new THREE.Vector3().subVectors(currPos, prevPos);
                if (deltaLocal.lengthSq() > 0.000001) {
                    handMesh.getWorldPosition(tmpHandWorld1);

                    if (currentZone === 'lobby') {
                        for (let i = 0; i < lobbyTrampolines.length; i++) {
                            if (lobbyTrampolines[i].distanceToPoint(tmpHandWorld1) < 0.3) {
                                playerBody.velocity.y = 16.0; prevPos.copy(currPos); return;
                            }
                        }
                    }

                    // Czuła detekcja podłoża (Y <= 0.45)
                    let touch = (tmpHandWorld1.y <= 0.45);
                    if (!touch) {
                        for (let i = 0; i < activeObstacles.length; i++) {
                            if (activeObstacles[i].distanceToPoint(tmpHandWorld1) <= 0.25) {
                                touch = true; break;
                            }
                        }
                    }

                    if (touch) {
                        const deltaWorld = deltaLocal.clone().applyQuaternion(playerRig.quaternion);
                        const push = -1800; // Siła impulsu Gorilla Tag
                        playerBody.applyImpulse(
                            new CANNON.Vec3(deltaWorld.x * push, deltaWorld.y * push, deltaWorld.z * push),
                            playerBody.position
                        );
                    }
                }
            }
            prevPos.copy(currPos);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();
            world.step(1 / 60, dt, 2);

            if (renderer.xr.isPresenting) {
                processMovement(controller1, localAvatar.handL, prevLocal1);
                processMovement(controller2, localAvatar.handR, prevLocal2);
            }
            if (isGrabbingRope) playerBody.velocity.y = -1.5;

            // Synchronizacja fizyki sfery z rigiem VR
            playerRig.position.set(
                playerBody.position.x,
                playerBody.position.y - radius,
                playerBody.position.z
            );

            if (currentZone === 'lobby') {
                if (portals[0].box3.containsPoint(camera.getWorldPosition(new THREE.Vector3()))) switchZone('maze');
            } else {
                const camPos = camera.getWorldPosition(new THREE.Vector3());
                if (mazeExitBox.containsPoint(camPos)) switchZone('lobby');

                if (playerPathHistory.length === 0 || playerPathHistory[playerPathHistory.length - 1].distanceToSquared(camPos) > 0.16) {
                    playerPathHistory.push(camPos.clone());
                }

                const timeInMaze = time - levelStartTime;
                if (gameStateMaze === 'maze_safe' && timeInMaze > 20) {
                    gameStateMaze = 'maze_anim';
                    monsterGroup.visible = true;
                    const spawnIdx = Math.max(0, playerPathHistory.length - 15);
                    monsterGroup.position.copy(playerPathHistory[spawnIdx] || camPos);
                    monsterGroup.position.y = 0;
                    monsterPathIndex = spawnIdx;
                    playScarySound('spawn');
                } else if (gameStateMaze === 'maze_anim') {
                    for (let i = 0; i < limbs.length; i++) {
                        limbs[i].rotation.x = Math.sin(time * 25 + i);
                        limbs[i].rotation.z = Math.cos(time * 25 + i);
                    }
                    if (timeInMaze > 25) gameStateMaze = 'maze_chase';
                } else if (gameStateMaze === 'maze_chase') {
                    monsterPathIndex = Math.min(monsterPathIndex + 12 * dt, playerPathHistory.length - 1);
                    const targetPt = playerPathHistory[Math.floor(monsterPathIndex)];
                    if (targetPt) {
                        monsterGroup.position.lerp(targetPt, 0.15);
                        monsterGroup.position.y = 0;
                    }
                    for (let i = 0; i < limbs.length; i++) {
                        limbs[i].rotation.x = Math.sin(time * 15 + i) * 0.6;
                    }
                    if (monsterGroup.position.distanceToSquared(camPos) < 1.8) {
                        triggerJumpscare();
                    }
                }
            }

            if (playerBody.position.y < -5) switchZone('lobby');

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
