<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagaBoo VR - Cloudy Day & Pro Models</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #7b8b9a; font-family: sans-serif; }
        
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #8fa3b3, #4a5c6a); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #111;
        }
        
        #lobby h1.logo { 
            font-family: 'Creepster', cursive; 
            font-size: 85px; 
            color: #008888; 
            margin-bottom: 5px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #fff, 0 0 15px rgba(0, 255, 255, 0.4);
        }

        #lobby p.subtitle { margin-bottom: 30px; color: #113333; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 340px; justify-content: space-between; }
        .form-group label { font-weight: bold; color: #222; }
        input, select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #7799aa; background: #e0e8f0; color: #111; width: 180px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1); }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; border: none; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; border: 1px solid #00aaaa; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-transform: uppercase; }
        #btnHost { background: #008888; color: #ffffff; }
        #btnJoin { background: #00aaaa; color: white; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,150,150,0.3); background: #009999; }
        button:disabled { background: #8899aa; color: #ddeeff; border-color: #778899; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status { margin-top: 25px; font-weight: bold; font-size: 16px; color: #004444; text-align: center; max-width: 400px; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #ffffff; font-weight: bold; font-size: 18px; z-index: 100; text-shadow: 2px 2px 4px black; display: none; }
        
        #VRButton { display: none !important; }
        .connected #VRButton { display: block !important; border-color: #00ffff !important; color: #00ffff !important; background: rgba(20,50,50,0.8) !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="lobby">
        <h1 class="logo">BagaBoo VR</h1>
        <p class="subtitle">Cloudy Day | Pro Models & Physics Fix</p>
        
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" placeholder="Player1" value="Acrobat" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#3d2314" /></div>
        <div class="form-group">
            <label>Hat:</label>
            <select id="playerHat">
                <option value="none">None</option>
                <option value="tophat">Top Hat</option>
                <option value="cap">Baseball Cap</option>
            </select>
        </div>
        <div class="form-group">
            <label>Glasses:</label>
            <select id="playerGlasses">
                <option value="none">None</option>
                <option value="sunglasses">Sunglasses</option>
            </select>
        </div>
        <div class="form-group" style="margin-top: 15px;"><label>Room Code:</label><input type="text" id="roomCode" placeholder="e.g. cloudcity" /></div>
        
        <div class="btn-group">
            <button id="btnHost">Host Game</button>
            <button id="btnJoin">Join Game</button>
        </div>
        <div id="status">Initializing Mic...</div>
    </div>

    <div id="info">Connected! Click "ENTER VR". Grab balls, wall-run, and jump!</div>
    <div id="audio-container" style="display:none;"></div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL VARIABLES ---
        let myProfile = { name: "Acrobat", color: "#3d2314", hat: "none", glasses: "none" };
        let myStream = null;

        const statusDiv = document.getElementById('status');
        async function initMic() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusDiv.innerText = "Mic access granted. Enter Room Code to play.";
            } catch (err) {
                statusDiv.innerText = "Mic access denied. Voice chat disabled.";
            }
        }
        initMic();

        // --- PROCEDURAL TEXTURES ---
        function createSciFiGridTexture() {
            const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#94a0ab'; ctx.fillRect(0, 0, 1024, 1024);
            for(let i=0; i<30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
                ctx.fillRect(Math.random()*1024, Math.random()*1024, 2, 2);
            }
            ctx.strokeStyle = 'rgba(0, 150, 150, 0.4)'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 1024, 1024);
            ctx.lineWidth = 2;
            for(let i=0; i<=1024; i+=128) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function createWoodTexture() {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6b4423'; ctx.fillRect(0,0,512,512);
            for(let i=0; i<300; i++) {
                ctx.fillStyle = Math.random()>0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';
                ctx.fillRect(0, Math.random()*512, 512, Math.random()*10 + 2);
            }
            const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function createCautionTexture() {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffcc00'; ctx.fillRect(0,0,512,512);
            ctx.fillStyle = '#222';
            for(let i=-512; i<1024; i+=64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+32, 0); ctx.lineTo(i+512+32, 512); ctx.lineTo(i+512, 512); ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        const scifiTex = createSciFiGridTexture();
        const woodTex = createWoodTexture();
        const cautionTex = createCautionTexture();

        // ==========================================
        // 1. ENGINE & PHYSICS (Cloudy Day)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8fa3b3); 
        scene.fog = new THREE.FogExp2(0x8fa3b3, 0.012); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; 
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement); 
        const vrBtn = VRButton.createButton(renderer); document.body.appendChild(vrBtn);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9); scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xfff5ed, 0.7);
        dirLight.position.set(15, 30, 15); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.top = 25; dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25; dirLight.shadow.camera.right = 25;
        dirLight.shadow.bias = -0.0005; 
        scene.add(dirLight);

        // --- CANNON PHYSICS SETUP WITH COLLISION GROUPS ---
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -12.0, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        
        const physicsMat = new CANNON.Material();
        const contactMat = new CANNON.ContactMaterial(physicsMat, physicsMat, { friction: 0.8, restitution: 0.0 });
        world.addContactMaterial(contactMat);

        // MASKI KOLIZJI (Rozwiązanie problemu z odlatywaniem)
        const GROUP_ENV = 1;
        const GROUP_PLAYER = 2;
        const GROUP_BALL = 4;

        const radius = 0.35; 
        const playerBody = new CANNON.Body({
            mass: 50, shape: new CANNON.Sphere(radius), material: physicsMat,
            position: new CANNON.Vec3(0, 2, 0), linearDamping: 0.1, fixedRotation: true,
            collisionFilterGroup: GROUP_PLAYER,
            // Gracz koliduje TYLKO ze środowiskiem (ściany, podłoga, przeszkody), IGNORUJE piłki!
            collisionFilterMask: GROUP_ENV 
        });
        world.addBody(playerBody);

        // ==========================================
        // 2. LOBBY BUILDING (Advanced Models)
        // ==========================================
        const obstacles = []; const trampolines = []; const ropes = []; const throwables = [];

        function addStaticBody(x, y, z, shape, meshOrGroup, isTrampoline = false) {
            const body = new CANNON.Body({ 
                mass: 0, shape: shape, material: physicsMat,
                collisionFilterGroup: GROUP_ENV,
                collisionFilterMask: -1 // Środowisko koliduje ze wszystkim
            });
            body.position.set(x, y, z); world.addBody(body);
            
            const box3 = new THREE.Box3().setFromObject(meshOrGroup);
            if (isTrampoline) {
                trampolines.push({ box3 });
                obstacles.push({ meshOrGroup, body, box3 });
            } else {
                obstacles.push({ meshOrGroup, body, box3 });
            }
        }

        // Grube ściany areny
        function addWall(x, y, z, w, h, d) {
            const material = new THREE.MeshStandardMaterial({ map: scifiTex, roughness: 0.6, metalness: 0.2 });
            scifiTex.repeat.set(Math.max(w, h)/5, Math.max(d, h)/5);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z); mesh.receiveShadow = true; mesh.castShadow = true; scene.add(mesh); 
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)), mesh);
        }

        addWall(0, -5, 0, 40, 10, 40); // Podłoga
        addWall(0, 25, 0, 40, 10, 40); // Sufit
        addWall(0, 10, -15, 40, 20, 10); // Ściana Północna
        addWall(0, 10, 15, 40, 20, 10);  // Ściana Południowa
        addWall(-15, 10, 0, 10, 20, 40); // Ściana Zachodnia
        addWall(15, 10, 0, 10, 20, 40);  // Ściana Wschodnia

        // ADVANCED MODEL: Drewniana Skrzynia (Crate)
        function addCrate(x, y, z, size) {
            const group = new THREE.Group(); group.position.set(x, y, z);
            const bodyMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9 });
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), bodyMat);
            bodyMesh.castShadow = true; bodyMesh.receiveShadow = true; group.add(bodyMesh);

            const edgeMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.4 });
            const t = size * 0.08; const l = size + 0.01;
            const edges = [
                [0, size/2, size/2, l, t, t], [0, size/2, -size/2, l, t, t], [0, -size/2, size/2, l, t, t], [0, -size/2, -size/2, l, t, t],
                [size/2, 0, size/2, t, l, t], [-size/2, 0, size/2, t, l, t], [size/2, 0, -size/2, t, l, t], [-size/2, 0, -size/2, t, l, t],
                [size/2, size/2, 0, t, t, l], [-size/2, size/2, 0, t, t, l], [size/2, -size/2, 0, t, t, l], [-size/2, -size/2, 0, t, t, l]
            ];
            edges.forEach(e => { const edge = new THREE.Mesh(new THREE.BoxGeometry(e[3], e[4], e[5]), edgeMat); edge.position.set(e[0], e[1], e[2]); edge.castShadow = true; group.add(edge); });
            scene.add(group);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2)), group);
        }

        // ADVANCED MODEL: Trampolina
        function addTrampoline(x, y, z, rad) {
            const group = new THREE.Group(); group.position.set(x, y, z);
            const padMat = new THREE.MeshStandardMaterial({ color: 0x00ccaa, emissive: 0x005544, roughness: 0.1, metalness: 0.2 });
            const padMesh = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, 0.2, 32), padMat);
            padMesh.castShadow = true; padMesh.receiveShadow = true; group.add(padMesh);
            
            const rimMat = new THREE.MeshStandardMaterial({ map: cautionTex, roughness: 0.5 });
            const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(rad + 0.1, 0.15, 16, 32), rimMat);
            rimMesh.rotation.x = Math.PI / 2; rimMesh.position.y = 0.1; rimMesh.castShadow = true; group.add(rimMesh);
            
            const legMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
            for(let i=0; i<4; i++) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5), legMat);
                const angle = (i/4) * Math.PI * 2; leg.position.set(Math.cos(angle)*(rad-0.1), -0.25, Math.sin(angle)*(rad-0.1)); leg.castShadow = true; group.add(leg);
            }
            scene.add(group);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(rad+0.1, 0.3, rad+0.1)), group, true);
        }

        // ADVANCED MODEL: Uchwyty (Grips)
        const gripGeo = new THREE.DodecahedronGeometry(0.25);
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x00aaaa, emissive: 0x003333, metalness: 0.5, roughness: 0.2 });
        function addGrip(x, y, z) {
            const mesh = new THREE.Mesh(gripGeo, gripMat); mesh.position.set(x, y, z); mesh.rotation.set(Math.random(), Math.random(), Math.random());
            mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
            addStaticBody(x, y, z, new CANNON.Box(new CANNON.Vec3(0.25, 0.25, 0.25)), mesh);
        }

        // ADVANCED MODEL: Wysoki Filar z Obręczami
        function addPillar(x, z, height) {
            const group = new THREE.Group(); group.position.set(x, height/2, z);
            const cylGeo = new THREE.CylinderGeometry(1, 1, height, 16);
            const cylMat = new THREE.MeshStandardMaterial({ map: scifiTex, roughness: 0.5 });
            const mesh = new THREE.Mesh(cylGeo, cylMat); mesh.castShadow = true; mesh.receiveShadow = true; group.add(mesh);
            
            const ringMat = new THREE.MeshStandardMaterial({ map: cautionTex, metalness: 0.6 });
            for(let y = -height/2 + 2; y < height/2; y += 3) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.1, 8, 24), ringMat);
                ring.rotation.x = Math.PI / 2; ring.position.y = y; ring.castShadow = true; group.add(ring);
            }
            scene.add(group);
            addStaticBody(x, height/2, z, new CANNON.Box(new CANNON.Vec3(1, height/2, 1)), group);
        }

        // Rozmieszczenie zaawansowanych przeszkód
        addCrate(-5, 1.5, -5, 3); 
        addCrate(5, 3.0, 5, 4);   
        addPillar(-6, 5, 10); 
        
        addTrampoline(0, 0.4, 5, 2.5); 

        // Liny
        const ropeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const ropeMesh1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 16), ropeMat);
        ropeMesh1.position.set(4, 10, -4); ropeMesh1.castShadow = true; scene.add(ropeMesh1); ropes.push(ropeMesh1);
        const ropeMesh2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 16), ropeMat);
        ropeMesh2.position.set(-4, 10, 4); ropeMesh2.castShadow = true; scene.add(ropeMesh2); ropes.push(ropeMesh2);

        // Uchwyty na ścianach
        for(let i = 0; i < 15; i++) {
            let px = -8 + (i * 1.1) + (Math.random() * 0.4 - 0.2);
            let py = 2 + (i * 0.9) + (Math.random() * 0.5);
            addGrip(px, py, -10);
        }
        for(let i = 0; i < 12; i++) {
            let px = 8 - (i * 1.3) + (Math.random() * 0.5);
            let py = 4 + (i * 1.1) + (Math.random() * 0.5);
            addGrip(px, py, 10);
        }

        // Fizyka piłek ze zmienionymi Maskami
        function createBall(id, x, y, z) {
            const mat = new THREE.MeshStandardMaterial({color: 0x00ccff, roughness: 0.2, metalness: 0.5});
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), mat);
            mesh.castShadow = true; scene.add(mesh);
            
            const body = new CANNON.Body({ 
                mass: 1, shape: new CANNON.Sphere(0.2), position: new CANNON.Vec3(x,y,z), material: physicsMat,
                collisionFilterGroup: GROUP_BALL,
                // Piłki odbijają się od środowiska i innych piłek, ale PRZENIKAJĄ gracza
                collisionFilterMask: GROUP_ENV | GROUP_BALL
            });
            world.addBody(body); mesh.userData = { id: id, body: body }; throwables.push(mesh);
        }
        createBall('ball1', 2, 1, -2); createBall('ball2', -2, 1, -2);

        // ==========================================
        // 3. MULTIPLAYER (1 HOST + 10 GUESTS)
        // ==========================================
        let peer = null; let hostConnection = null; let clientConnections = [];
        let isHost = false; let myPeerId = null; const GAME_PREFIX = "vr-gtag-fix2-";
        let playersState = {}; const remotePlayersVisuals = {}; let sharedObjectsState = {};
        const MAX_GUESTS = 10; 

        function onConnectionSuccess() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            document.body.classList.add('connected');
            setInterval(networkTick, 1000 / 30);
        }
        function playAudioStream(stream, peerId) {
            const audio = document.createElement('audio'); audio.srcObject = stream; audio.autoplay = true;
            document.getElementById('audio-container').appendChild(audio);
        }
        function updateProfileData() {
            myProfile.name = document.getElementById('playerName').value || "Acrobat";
            myProfile.color = document.getElementById('playerColor').value;
            myProfile.hat = document.getElementById('playerHat').value;
            myProfile.glasses = document.getElementById('playerGlasses').value;
        }

        document.getElementById('btnHost').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); 
            if(!code) { alert("Please enter a Room Code."); return; }
            updateProfileData();
            document.getElementById('btnHost').disabled = true; document.getElementById('btnJoin').disabled = true;
            statusDiv.innerText = "Creating room...";
            isHost = true; peer = new Peer(GAME_PREFIX + code);
            
            peer.on('open', (id) => { 
                myPeerId = id; 
                statusDiv.innerText = "Room Created! Waiting for players..."; 
                onConnectionSuccess(); 
            });
            peer.on('error', (err) => { 
                statusDiv.innerText = "Error: " + err.message; 
                document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; 
            });
            
            peer.on('connection', (conn) => {
                if (clientConnections.length >= MAX_GUESTS) {
                    conn.on('open', () => {
                        conn.send({ type: 'serverFull', message: 'The room is full! Maximum 10 guests allowed.' });
                        setTimeout(() => conn.close(), 1000);
                    });
                    return;
                }
                clientConnections.push(conn);
                conn.on('data', (data) => { 
                    if (data.type === 'playerUpdate') playersState[conn.peer] = data.payload; 
                    if (data.type === 'objectMove') sharedObjectsState[data.id] = data.payload; 
                });
                conn.on('close', () => { 
                    clientConnections = clientConnections.filter(c => c !== conn); 
                    delete playersState[conn.peer]; 
                    removeRemotePlayerVisual(conn.peer); 
                });
            });
            peer.on('call', (call) => { if(myStream) call.answer(myStream); call.on('stream', (remoteStream) => { playAudioStream(remoteStream, call.peer); }); });
        };

        document.getElementById('btnJoin').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); 
            if(!code) { alert("Please enter a Room Code."); return; }
            updateProfileData();
            document.getElementById('btnHost').disabled = true; document.getElementById('btnJoin').disabled = true;
            statusDiv.innerText = "Joining...";
            isHost = false; peer = new Peer();
            
            peer.on('open', (id) => {
                myPeerId = id; hostConnection = peer.connect(GAME_PREFIX + code);
                hostConnection.on('open', () => { statusDiv.innerText = "Connected!"; onConnectionSuccess(); });
                hostConnection.on('data', (data) => {
                    if (data.type === 'serverFull') { alert(data.message); window.location.reload(); return; }
                    if (data.type === 'gameState') {
                        for (let pId in data.payload.players) { 
                            if (pId === myPeerId) continue; 
                            playersState[pId] = data.payload.players[pId]; 
                            updateRemotePlayerVisual(pId, data.payload.players[pId]); 
                        }
                        for (let pId in remotePlayersVisuals) { if (!data.payload.players[pId]) removeRemotePlayerVisual(pId); }
                        for(let objId in data.payload.objects) { if(!grabbedObject || grabbedObject.userData.id !== objId) syncObject(objId, data.payload.objects[objId]); }
                    }
                });
                hostConnection.on('close', () => { alert("Connection lost / Host left."); window.location.reload(); });
                if(myStream) { const call = peer.call(GAME_PREFIX + code, myStream); call.on('stream', (remoteStream) => { playAudioStream(remoteStream, call.peer); }); }
            });
            peer.on('error', (err) => { statusDiv.innerText = "Error: Room not found."; document.getElementById('btnHost').disabled = false; document.getElementById('btnJoin').disabled = false; });
        };

        // ==========================================
        // 4. AVATARS
        // ==========================================
        function createNameSprite(message) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.roundRect(0,0,512,128,20); ctx.fill(); 
            ctx.strokeStyle = '#008888'; ctx.lineWidth = 6; ctx.roundRect(0,0,512,128,20); ctx.stroke(); 
            ctx.font = "bold 60px sans-serif"; ctx.fillStyle = "#111111"; ctx.textAlign = "center"; ctx.fillText(message, 256, 85);
            return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
        }

        function createAvatar(profile, isLocal) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: profile.color, roughness: 0.8 });
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.35), mat); torso.castShadow = true; group.add(torso);
            let head = new THREE.Group();
            
            if (!isLocal) {
                const pSnout = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.15), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 }));
                pSnout.position.set(0, -0.1, -0.15); head.add(pSnout);
                const pBrow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.08), mat); pBrow.position.set(0, 0.02, -0.12); head.add(pBrow);
                
                if(profile.hat === 'tophat') {
                    const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.9}));
                    hat.position.set(0, 0.15, -0.05); head.add(hat);
                } else if (profile.hat === 'cap') {
                    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.2), new THREE.MeshStandardMaterial({color: 0x0055aa}));
                    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.15), new THREE.MeshStandardMaterial({color: 0x0055aa}));
                    cap.position.set(0, 0.1, -0.05); brim.position.set(0, 0.05, -0.2); head.add(cap, brim);
                }
                if(profile.glasses === 'sunglasses') {
                    const gl = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.06, 0.02), new THREE.MeshStandardMaterial({color: 0x050505}));
                    gl.position.set(0, 0.02, -0.17); head.add(gl);
                }
                const nameTag = createNameSprite(profile.name); nameTag.position.set(0, 0.4, 0); nameTag.scale.set(2, 0.5, 1); head.add(nameTag);
                group.add(head);
            }
            const createHand = () => { const h = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), mat); p.castShadow = true; h.add(p); return h; };
            
            let handL = createHand(); let handR = createHand(); 
            if (!isLocal) group.add(handL, handR);
            return { group, torso, head, handL, handR };
        }

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1); playerRig.add(controller2);
        const localAvatar = createAvatar(myProfile, true);
        scene.add(localAvatar.group); 

        controller1.add(localAvatar.handL); controller2.add(localAvatar.handR);

        let grabbedObject = null; let grabbingController = null; let isGrabbingRope = false;
        function onSqueezeStart(event) {
            const ctrl = event.target; const pos = new THREE.Vector3(); ctrl.getWorldPosition(pos);
            for(let ball of throwables) { 
                if(ball.position.distanceTo(pos) < 0.3) { 
                    grabbedObject = ball; grabbingController = ctrl; 
                    grabbedObject.userData.body.type = CANNON.Body.KINEMATIC; 
                    grabbedObject.userData.body.velocity.set(0,0,0);
                    grabbedObject.userData.body.angularVelocity.set(0,0,0);
                    return; 
                } 
            }
            for(let rope of ropes) { if(new THREE.Box3().setFromObject(rope).expandByScalar(0.5).containsPoint(pos)) { isGrabbingRope = true; playerBody.velocity.set(0,0,0); return; } }
        }
        function onSqueezeEnd(event) {
            isGrabbingRope = false;
            if(grabbedObject && grabbingController === event.target) {
                grabbedObject.userData.body.type = CANNON.Body.DYNAMIC;
                const throwDir = new THREE.Vector3(0,0,-1).applyQuaternion(event.target.quaternion).multiplyScalar(15);
                grabbedObject.userData.body.velocity.copy(new CANNON.Vec3(throwDir.x, throwDir.y + 5, throwDir.z));
                if(!isHost && hostConnection) hostConnection.send({ type: 'objectMove', id: grabbedObject.userData.id, payload: { p: grabbedObject.position.toArray(), q: grabbedObject.quaternion.toArray(), v: [throwDir.x, throwDir.y+5, throwDir.z] }});
                grabbedObject = null; grabbingController = null;
            }
        }
        controller1.addEventListener('squeezestart', onSqueezeStart); controller1.addEventListener('squeezeend', onSqueezeEnd);
        controller2.addEventListener('squeezestart', onSqueezeStart); controller2.addEventListener('squeezeend', onSqueezeEnd);

        function updateRemotePlayerVisual(id, state) {
            if (!remotePlayersVisuals[id]) { const newAvatar = createAvatar(state.profile, false); scene.add(newAvatar.group); remotePlayersVisuals[id] = newAvatar; }
            const p = remotePlayersVisuals[id];
            p.head.position.fromArray(state.head.p); p.head.quaternion.fromArray(state.head.q);
            p.handL.position.fromArray(state.h1.p); p.handL.quaternion.fromArray(state.h1.q);
            p.handR.position.fromArray(state.h2.p); p.handR.quaternion.fromArray(state.h2.q);
            const euler = new THREE.Euler().setFromQuaternion(p.head.quaternion, "YXZ");
            p.torso.position.copy(p.head.position).add(new THREE.Vector3(0, -0.35, 0)); p.torso.rotation.set(0, euler.y, 0);
        }
        function removeRemotePlayerVisual(id) { if (remotePlayersVisuals[id]) { scene.remove(remotePlayersVisuals[id].group); delete remotePlayersVisuals[id]; } }
        function syncObject(id, data) {
            const ball = throwables.find(b => b.userData.id === id);
            if(ball && ball.userData.body.type === CANNON.Body.DYNAMIC) {
                ball.userData.body.position.set(data.p[0], data.p[1], data.p[2]); ball.userData.body.quaternion.set(data.q[0], data.q[1], data.q[2], data.q[3]); ball.userData.body.velocity.set(data.v[0], data.v[1], data.v[2]);
            }
        }
        
        function networkTick() {
            if (!myPeerId) return;
            const hp = new THREE.Vector3(); const hq = new THREE.Quaternion(); camera.getWorldPosition(hp); camera.getWorldQuaternion(hq);
            const l1p = new THREE.Vector3(); const l1q = new THREE.Quaternion(); localAvatar.handL.getWorldPosition(l1p); localAvatar.handL.getWorldQuaternion(l1q);
            const l2p = new THREE.Vector3(); const l2q = new THREE.Quaternion(); localAvatar.handR.getWorldPosition(l2p); localAvatar.handR.getWorldQuaternion(l2q);
            const myState = { profile: myProfile, head: { p: hp.toArray(), q: hq.toArray() }, h1: { p: l1p.toArray(), q: l1q.toArray() }, h2: { p: l2p.toArray(), q: l2q.toArray() } };
            
            if(isHost) {
                for(let ball of throwables) { sharedObjectsState[ball.userData.id] = { p: ball.userData.body.position.toArray(), q: ball.userData.body.quaternion.toArray(), v: ball.userData.body.velocity.toArray() }; }
                playersState[myPeerId] = myState;
                clientConnections.forEach(c => { if(c.open) c.send({ type: 'gameState', payload: { players: playersState, objects: sharedObjectsState } }); });
            } else if (hostConnection && hostConnection.open) { hostConnection.send({ type: 'playerUpdate', payload: myState }); }
        }

        // ==========================================
        // 5. ADVANCED MOVEMENT (WALL JUMP / WALL RUN)
        // ==========================================
        let prevLocalPos1 = new THREE.Vector3(); let prevLocalPos2 = new THREE.Vector3();
        const clock = new THREE.Clock();

        function handleMovement(controller, handMesh, prevLocalPos) {
            const currentLocalPos = controller.position.clone();
            if (prevLocalPos.lengthSq() > 0 && !isGrabbingRope) {
                const deltaLocalPos = new THREE.Vector3().subVectors(currentLocalPos, prevLocalPos);
                
                const handWorldPos = new THREE.Vector3(); 
                handMesh.getWorldPosition(handWorldPos);

                let isTouchingGround = false;
                let isTouchingWall = false;
                
                if (handWorldPos.y <= 0.25) {
                    isTouchingGround = true;
                } else {
                    for(let obs of obstacles) {
                        if (obs.box3.distanceToPoint(handWorldPos) <= 0.25) { 
                            if (handWorldPos.y > obs.box3.min.y + 0.1) {
                                isTouchingWall = true;
                            } else {
                                isTouchingGround = true;
                            }
                            break; 
                        }
                    }
                }

                for(let t of trampolines) {
                    if (t.box3.distanceToPoint(handWorldPos) <= 0.25) {
                        playerBody.velocity.y = 15; 
                        isTouchingGround = false; isTouchingWall = false; 
                        break;
                    }
                }

                if ((isTouchingGround || isTouchingWall) && deltaLocalPos.lengthSq() > 0) {
                    const deltaWorld = deltaLocalPos.clone().applyQuaternion(playerRig.quaternion);
                    
                    if(deltaWorld.length() > 0.5) deltaWorld.normalize().multiplyScalar(0.5);

                    let pushForceXZ = -1300; 
                    let pushForceY = -1300;

                    if (isTouchingWall) {
                        if (playerBody.velocity.y < 0) {
                            playerBody.velocity.y = 0;
                        }
                        pushForceY = -1600;
                        pushForceXZ = -1500;
                    }

                    playerBody.applyImpulse(
                        new CANNON.Vec3(deltaWorld.x * pushForceXZ, deltaWorld.y * pushForceY, deltaWorld.z * pushForceXZ), 
                        playerBody.position
                    );
                }
            }
            prevLocalPos.copy(currentLocalPos);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.1); world.step(1/60, dt, 3);
            if (renderer.xr.isPresenting) {
                handleMovement(controller1, localAvatar.handL, prevLocalPos1); handleMovement(controller2, localAvatar.handR, prevLocalPos2);
            }
            if(isGrabbingRope) playerBody.velocity.y = -2;
            
            if(grabbedObject && grabbingController) {
                const ctrlPos = new THREE.Vector3(); grabbingController.getWorldPosition(ctrlPos); grabbedObject.userData.body.position.copy(ctrlPos);
            }
            for(let ball of throwables) { ball.position.copy(ball.userData.body.position); ball.quaternion.copy(ball.userData.body.quaternion); }

            const camLocalPos = camera.position.clone();
            const gorillaStanceOffset = 0.6;

            playerRig.position.set(
                playerBody.position.x - camLocalPos.x,
                playerBody.position.y - radius - gorillaStanceOffset,
                playerBody.position.z - camLocalPos.z
            );

            const camWorldPos = new THREE.Vector3(); camera.getWorldPosition(camWorldPos);
            const camWorldQuat = new THREE.Quaternion(); camera.getWorldQuaternion(camWorldQuat);
            const euler = new THREE.Euler().setFromQuaternion(camWorldQuat, "YXZ");
            
            localAvatar.torso.position.copy(camWorldPos).add(new THREE.Vector3(0, -0.35, 0));
            localAvatar.torso.rotation.set(0, euler.y, 0);

            renderer.render(scene, camera);
        });
    </script>
