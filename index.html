<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVR Gorilla Tag - Backrooms Maze Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a2a20, #0a0a08); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #d4d4aa;
        }
        #lobby h1 { margin-bottom: 5px; font-size: 40px; text-shadow: 0 0 10px #ffffaa; text-transform: uppercase; letter-spacing: 3px; }
        #lobby p.subtitle { margin-bottom: 25px; color: #888; font-size: 14px; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 340px; justify-content: space-between; color: white;}
        input, select { padding: 10px; font-size: 16px; border-radius: 2px; border: 1px solid #aa8822; background: #111; color: white; width: 180px; }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { padding: 15px 25px; font-size: 16px; font-weight: bold; border: 1px solid #aa8822; border-radius: 2px; cursor: pointer; background: #111; color: #aa8822; text-transform: uppercase; }
        button:hover { background: #332200; box-shadow: 0 0 15px #aa8822; }
        #status { margin-top: 20px; font-weight: bold; font-size: 16px; color: #ff5555; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #fff; font-weight: bold; z-index: 100; display: none; }
        #VRButton { display: none !important; }
        .connected #VRButton { display: block !important; border: 1px solid #aa8822 !important; background: #111 !important; color: white !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="lobby">
        <h1>Gorilla Tag: The Maze</h1>
        <p class="subtitle">Climb the Lobby. Survive Level 1.</p>
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" value="Survivor" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#3d2314" /></div>
        <div class="form-group"><label>Room Code:</label><input type="text" id="roomCode" placeholder="e.g. maze1" /></div>
        <div class="btn-group">
            <button id="btnHost">Host Game</button>
            <button id="btnJoin">Join Game</button>
        </div>
        <div id="status">Initializing...</div>
    </div>
    <div id="info">Connected. Click "ENTER VR". Look up to find the levels.</div>
    <div id="audio-container" style="display:none;"></div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        let myProfile = { name: "Survivor", color: "#3d2314" };
        let myStream = null;

        const statusDiv = document.getElementById('status');
        async function initMic() {
            try { myStream = await navigator.mediaDevices.getUserMedia({ audio: true }); statusDiv.innerText = "Mic access granted."; } 
            catch (err) { statusDiv.innerText = "Mic access denied."; }
        }
        initMic();

        // ==========================================
        // 1. ENGINE & PHYSICS
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.04); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;
        document.body.appendChild(renderer.domElement); 
        document.body.appendChild(VRButton.createButton(renderer));

        const ambientLight = new THREE.AmbientLight(0xffffee, 0.3); scene.add(ambientLight);
        
        // Czołówka gracza
        const flashlight = new THREE.SpotLight(0xfff5b6, 150, 40, Math.PI/4, 0.5, 1);
        camera.add(flashlight);
        const flashlightTarget = new THREE.Object3D(); flashlightTarget.position.set(0, 0, -1); camera.add(flashlightTarget);
        flashlight.target = flashlightTarget;

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -12.0, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        const physicsMat = new CANNON.Material();
        const contactMat = new CANNON.ContactMaterial(physicsMat, physicsMat, { friction: 0.8, restitution: 0.0 });
        world.addContactMaterial(contactMat);

        const radius = 0.35; 
        const playerBody = new CANNON.Body({ mass: 50, shape: new CANNON.Sphere(radius), material: physicsMat, position: new CANNON.Vec3(0, 2, 0), linearDamping: 0.1, fixedRotation: true });
        world.addBody(playerBody);

        // ==========================================
        // 2. PROCEDURAL GENERATORS (TEXTURES, JUMPSCARE, AUDIO)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playScarySound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'spawn') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 2);
                gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 5);
                osc.start(); osc.stop(audioCtx.currentTime + 5);
            } else if (type === 'jumpscare') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(2000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // Texture for Jumpscare
        const jsCanvas = document.createElement('canvas'); jsCanvas.width = 512; jsCanvas.height = 512;
        const jsCtx = jsCanvas.getContext('2d');
        jsCtx.fillStyle = 'black'; jsCtx.fillRect(0,0,512,512);
        jsCtx.fillStyle = 'red'; jsCtx.beginPath(); jsCtx.arc(150, 200, 50, 0, Math.PI*2); jsCtx.arc(350, 200, 50, 0, Math.PI*2); jsCtx.fill(); // Oczy
        jsCtx.strokeStyle = 'white'; jsCtx.lineWidth = 10; jsCtx.beginPath(); jsCtx.moveTo(100, 400); jsCtx.lineTo(256, 450); jsCtx.lineTo(400, 400); jsCtx.stroke(); // Usta
        for(let i=0; i<1000; i++) { jsCtx.fillStyle = Math.random()>0.5?'white':'black'; jsCtx.fillRect(Math.random()*512, Math.random()*512, 5, 5); } // Szum
        const jumpscareMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(jsCanvas), transparent: true, opacity: 0}));
        jumpscareMesh.position.set(0, 0, -1); camera.add(jumpscareMesh); // Przypięte do twarzy

        // ==========================================
        // 3. WORLD BUILDING: LOBBY & MAZE
        // ==========================================
        const obstacles = []; const portals = []; let mazeExitBox = null;
        
        function addPhysBox(x, y, z, w, h, d, mat, addToObstacles = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); scene.add(mesh);
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0, shape: shape, material: physicsMat });
            body.position.set(x, y, z); world.addBody(body);
            const box3 = new THREE.Box3(new THREE.Vector3(x-w/2, y-h/2, z-d/2), new THREE.Vector3(x+w/2, y+h/2, z+d/2));
            if(addToObstacles) obstacles.push({ body, box3 });
            return mesh;
        }

        // --- LOBBY (10x10x10m w punkcie 0,0,0) ---
        const lobbyMat = new THREE.MeshStandardMaterial({color: 0x444444, roughness: 0.9});
        addPhysBox(0, -0.5, 0, 10, 1, 10, lobbyMat); // Podłoga
        addPhysBox(0, 5, -5.5, 11, 10, 1, lobbyMat); addPhysBox(0, 5, 5.5, 11, 10, 1, lobbyMat); // Ściany
        addPhysBox(-5.5, 5, 0, 1, 10, 11, lobbyMat); addPhysBox(5.5, 5, 0, 1, 10, 11, lobbyMat);

        // Przeszkody do parkouru w Lobby (Zygzak do góry)
        const woodMat = new THREE.MeshStandardMaterial({color: 0x8B4513});
        addPhysBox(4, 1.5, -4, 2, 0.5, 2, woodMat); addPhysBox(0, 3.0, -4, 2, 0.5, 2, woodMat);
        addPhysBox(-4, 4.5, -4, 2, 0.5, 2, woodMat); addPhysBox(-4, 6.0, 0, 2, 0.5, 2, woodMat);
        addPhysBox(0, 7.5, 4, 3, 0.5, 3, woodMat); // Platforma główna u góry

        // 10 Portali
        const portalMat = new THREE.MeshBasicMaterial({color: 0x00ffaa});
        for(let i=1; i<=10; i++) {
            const px = -4.5 + (i%5)*2.2; const pz = i<=5 ? 4.5 : 2.5;
            const p = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), portalMat.clone());
            if(i !== 1) p.material.color.setHex(0xff0000); // Tylko lvl 1 jest zielony
            p.position.set(px, 9, pz); scene.add(p);
            portals.push({ mesh: p, level: i, box3: new THREE.Box3().setFromObject(p) });
        }

        // --- MAZE (Level 1) - 70x70m w punkcie X=500 ---
        const MAZE_OFFSET_X = 500;
        const GRID_SIZE = 14; const CELL_SIZE = 5;
        
        // Generator labiryntu (Pseudo-Random DFS by labirynt był zawsze ten sam)
        let seed = 12345;
        function random() { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
        
        const grid = Array(GRID_SIZE).fill().map(()=>Array(GRID_SIZE).fill({v:false, r:true, b:true})); // visited, right-wall, bottom-wall
        function carve(cx, cy) {
            grid[cy][cx] = {...grid[cy][cx], v:true};
            const dirs = [[0,-1], [1,0], [0,1], [-1,0]].sort(()=>random()-0.5); // N, E, S, W
            for(let [dx, dy] of dirs) {
                let nx = cx+dx, ny = cy+dy;
                if(nx>=0 && nx<GRID_SIZE && ny>=0 && ny<GRID_SIZE && !grid[ny][nx].v) {
                    if(dx===1) grid[cy][cx].r = false; else if(dx===-1) grid[ny][nx].r = false;
                    if(dy===1) grid[cy][cx].b = false; else if(dy===-1) grid[ny][nx].b = false;
                    carve(nx, ny);
                }
            }
        }
        carve(0,0);

        // Renderowanie ścian (InstancedMesh dla wydajności)
        const wallGeo = new THREE.BoxGeometry(CELL_SIZE + 1, 10, 1);
        const backroomsMat = new THREE.MeshStandardMaterial({color: 0xcccc77, roughness: 1.0}); // Żółte tapety
        const wallInst = new THREE.InstancedMesh(wallGeo, backroomsMat, GRID_SIZE*GRID_SIZE*2 + 50);
        let wCount = 0; const dummy = new THREE.Object3D();
        
        function addMazeWall(x, z, rotY) {
            dummy.position.set(x, 5, z); dummy.rotation.set(0, rotY, 0); dummy.updateMatrix();
            wallInst.setMatrixAt(wCount++, dummy.matrix);
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(rotY?0.5:(CELL_SIZE+1)/2, 5, rotY?(CELL_SIZE+1)/2:0.5)), material: physicsMat });
            body.position.set(x, 5, z); world.addBody(body);
            
            const w = rotY?1:CELL_SIZE+1; const d = rotY?CELL_SIZE+1:1;
            obstacles.push({ body, box3: new THREE.Box3(new THREE.Vector3(x-w/2, 0, z-d/2), new THREE.Vector3(x+w/2, 10, z+d/2)) });
        }

        // Granice Labiryntu
        for(let i=0; i<GRID_SIZE; i++) {
            addMazeWall(MAZE_OFFSET_X + i*CELL_SIZE, -CELL_SIZE/2, 0); // Top
            addMazeWall(MAZE_OFFSET_X - CELL_SIZE/2, i*CELL_SIZE, Math.PI/2); // Left
        }
        
        // Wewnętrzne ściany z Grid'a
        for(let y=0; y<GRID_SIZE; y++) {
            for(let x=0; x<GRID_SIZE; x++) {
                let px = MAZE_OFFSET_X + x*CELL_SIZE; let pz = y*CELL_SIZE;
                if(grid[y][x].r) addMazeWall(px + CELL_SIZE/2, pz, Math.PI/2);
                if(grid[y][x].b) addMazeWall(px, pz + CELL_SIZE/2, 0);
                
                // Strzałki (Podpowiedzi co 3 kratki, wskazujące mniej więcej w stronę rogu 13,13)
                if((x+y)%4 === 0 && (x<GRID_SIZE-1 || y<GRID_SIZE-1)) {
                    const arrow = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.MeshBasicMaterial({color: 0x00ff00}));
                    arrow.rotation.x = -Math.PI/2; arrow.position.set(px, 0.01, pz);
                    arrow.rotation.z = Math.atan2((GRID_SIZE-1-y), (GRID_SIZE-1-x));
                    scene.add(arrow);
                }
            }
        }
        scene.add(wallInst);

        // Podłoga i Sufit Labiryntu (Zamknięta puszka)
        const floorMat = new THREE.MeshStandardMaterial({color: 0x555544, roughness: 0.9});
        addPhysBox(MAZE_OFFSET_X + 32.5, -0.5, 32.5, 75, 1, 75, floorMat); // Podłoga
        addPhysBox(MAZE_OFFSET_X + 32.5, 10.5, 32.5, 75, 1, 75, floorMat); // Sufit (Brak ucieczki)

        // Wyjście z Labiryntu (Róg 13,13)
        const exitMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 4), new THREE.MeshBasicMaterial({color: 0x00aaff}));
        exitMesh.position.set(MAZE_OFFSET_X + 13*CELL_SIZE, 0.1, 13*CELL_SIZE); scene.add(exitMesh);
        mazeExitBox = new THREE.Box3().setFromObject(exitMesh);

        // ==========================================
        // 4. THE MONSTER (BACTERIA) & GAME LOGIC
        // ==========================================
        const monsterGroup = new THREE.Group();
        const mMat = new THREE.MeshBasicMaterial({color: 0x000000}); // Czysta czerń
        const limbs = [];
        for(let i=0; i<15; i++) {
            const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3+Math.random()*2), mMat);
            limb.position.set((Math.random()-0.5), (Math.random()-0.5)*3, (Math.random()-0.5));
            monsterGroup.add(limb); limbs.push(limb);
        }
        scene.add(monsterGroup);
        monsterGroup.visible = false;
        const monsterBox = new THREE.Box3();

        let gameState = 'lobby'; // 'lobby', 'maze_safe', 'maze_anim', 'maze_chase'
        let levelStartTime = 0;
        let playerPathHistory = [];
        let monsterPathIndex = 0;

        function teleportPlayer(x, y, z) {
            playerBody.position.set(x, y, z); playerBody.velocity.set(0,0,0);
            playerPathHistory = []; // Reset śladów
        }

        function triggerJumpscare() {
            jumpscareMesh.material.opacity = 1; playScarySound('jumpscare');
            setTimeout(() => { jumpscareMesh.material.opacity = 0; teleportPlayer(0, 2, 0); gameState = 'lobby'; monsterGroup.visible = false; }, 1000);
        }

        // ==========================================
        // 5. AVATAR & MULTIPLAYER
        // ==========================================
        function createAvatar(isLocal) {
            const g = new THREE.Group();
            const hMat = new THREE.MeshStandardMaterial({color: isLocal ? myProfile.color : 0x555555});
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.35), hMat); g.add(torso);
            const handL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), hMat);
            const handR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.14), hMat);
            if(!isLocal) g.add(handL, handR);
            return { group: g, torso, handL, handR };
        }

        const controller1 = renderer.xr.getController(0); const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1); playerRig.add(controller2);
        const localAvatar = createAvatar(true); scene.add(localAvatar.group);
        const armExt = new THREE.Vector3(0, -0.45, -0.05);
        localAvatar.handL.position.copy(armExt); localAvatar.handR.position.copy(armExt);
        controller1.add(localAvatar.handL); controller2.add(localAvatar.handR);

        let peer = null; let hostConn = null; let clients = []; let isHost = false; let peersData = {};
        
        document.getElementById('btnHost').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); if(!code) return;
            document.body.classList.add('connected'); document.getElementById('lobby').style.display='none'; document.getElementById('info').style.display='block';
            isHost = true; peer = new Peer("vr-maze-" + code);
            peer.on('connection', c => { clients.push(c); c.on('data', d => peersData[c.peer]=d.p); });
        };
        document.getElementById('btnJoin').onclick = () => {
            const code = document.getElementById('roomCode').value.trim(); if(!code) return;
            document.body.classList.add('connected'); document.getElementById('lobby').style.display='none'; document.getElementById('info').style.display='block';
            peer = new Peer(); peer.on('open', () => { hostConn = peer.connect("vr-maze-" + code); hostConn.on('data', d => peersData=d); });
        };

        // ==========================================
        // 6. MAIN LOOP (MOVEMENT & LOGIC)
        // ==========================================
        let prevLocal1 = new THREE.Vector3(); let prevLocal2 = new THREE.Vector3();
        const clock = new THREE.Clock(); const raycaster = new THREE.Raycaster(); const downVec = new THREE.Vector3(0, -1, 0);

        function handleMovement(ctrl, hand, prev) {
            const curr = ctrl.position.clone();
            if (prev.lengthSq() > 0) {
                const delta = new THREE.Vector3().subVectors(curr, prev);
                const wPos = new THREE.Vector3(); hand.getWorldPosition(wPos);
                let touch = false;
                
                // Optymalna kolizja: sprawdzamy tylko bliskie Box3
                for(let obs of obstacles) {
                    if (obs.box3.distanceToPoint(wPos) < 0.5) { // Szybki dystans
                        if(obs.box3.clone().expandByScalar(0.12).containsPoint(wPos)) { touch = true; break; }
                    }
                }
                
                if (touch && delta.lengthSq() > 0) {
                    const force = delta.applyQuaternion(playerRig.quaternion).multiplyScalar(-1400);
                    playerBody.applyImpulse(new CANNON.Vec3(force.x, force.y, force.z), playerBody.position);
                }
            }
            prev.copy(curr);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.1); const time = clock.getElapsedTime();
            world.step(1/60, dt, 3);
            
            if (renderer.xr.isPresenting) {
                handleMovement(controller1, localAvatar.handL, prevLocal1); handleMovement(controller2, localAvatar.handR, prevLocal2);
            }

            // Sync Rigs
            const camLoc = camera.position.clone();
            playerRig.position.set(playerBody.position.x - camLoc.x, playerBody.position.y - radius - 0.6, playerBody.position.z - camLoc.z);
            const wPos = new THREE.Vector3(); camera.getWorldPosition(wPos);
            localAvatar.torso.position.copy(wPos).add(new THREE.Vector3(0, -0.35, 0));
            localAvatar.torso.rotation.y = new THREE.Euler().setFromQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()), "YXZ").y;

            // --- GAME LOGIC ---
            const pHead = wPos;
            
            if (gameState === 'lobby') {
                // Sprawdzanie wejścia do portalu nr 1
                if (portals[0].box3.containsPoint(pHead)) {
                    teleportPlayer(MAZE_OFFSET_X, 2, 0); // Start labiryntu (x=0, y=0 w siatce)
                    gameState = 'maze_safe'; levelStartTime = time;
                }
            } 
            else if (gameState.startsWith('maze')) {
                // Wyjście z labiryntu
                if (mazeExitBox.containsPoint(pHead)) { teleportPlayer(0, 2, 0); gameState = 'lobby'; monsterGroup.visible = false; }
                
                // Zapisywanie historii ruchów gracza co klatkę do kolejki (Breadcrumbs)
                playerPathHistory.push({ p: pHead.clone(), t: time });
                
                // Mini Jumpscary w labiryncie (Losowe błyski jak zepsuta kamera)
                if (Math.random() < 0.001) { jumpscareMesh.material.opacity = 0.3; setTimeout(()=>jumpscareMesh.material.opacity=0, 100); }
                
                // Sekwencja Potwora
                const timeInMaze = time - levelStartTime;
                
                if (gameState === 'maze_safe' && timeInMaze > 20) {
                    gameState = 'maze_anim'; monsterGroup.visible = true;
                    // Spawn potwora kilkanaście metrów za nami (bierzemy starą pozycję z historii)
                    const spawnData = playerPathHistory.find(h => h.t > levelStartTime + 5) || playerPathHistory[0];
                    monsterGroup.position.copy(spawnData.p); monsterPathIndex = playerPathHistory.indexOf(spawnData);
                    playScarySound('spawn');
                }
                
                if (gameState === 'maze_anim') {
                    // Animacja wrzasku (chaos)
                    limbs.forEach(l => { l.rotation.x += Math.random(); l.rotation.y += Math.random(); });
                    if (timeInMaze > 25) gameState = 'maze_chase';
                }
                
                if (gameState === 'maze_chase') {
                    // Pościg po śladach. Potwór pożera indeksy szybciej (krok 1.5) by dogonić gracza
                    monsterPathIndex = Math.min(monsterPathIndex + 1.2, playerPathHistory.length - 1);
                    const targetPos = playerPathHistory[Math.floor(monsterPathIndex)].p;
                    monsterGroup.position.lerp(targetPos, 0.2); // Płynne podążanie do węzła
                    
                    // Odgłosy kroku/drgania potwora
                    limbs.forEach((l, i) => { l.rotation.x = Math.sin(time * 10 + i); l.rotation.y = Math.cos(time * 12 + i); });

                    // Kolizja potwora z graczem
                    monsterBox.setFromObject(monsterGroup).expandByScalar(0.5);
                    if (monsterBox.containsPoint(pHead)) triggerJumpscare();
                }
            }

            // Ochrona przed wypadnięciem pod mapę
            if (playerBody.position.y < -5) teleportPlayer(0, 2, 0);

            // Sieć
            if(peer) {
                const hl1 = new THREE.Vector3(); localAvatar.handL.getWorldPosition(hl1);
                const hr1 = new THREE.Vector3(); localAvatar.handR.getWorldPosition(hr1);
                const state = { h: wPos.toArray(), l: hl1.toArray(), r: hr1.toArray() };
                if(isHost) {
                    peersData['host'] = state; clients.forEach(c => c.send(peersData));
                } else if(hostConn) { hostConn.send({p: state}); }
            }

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
