<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagaBoo VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a2a20, #0a0a08); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #d4d4aa;
        }
        #menu h1 { margin-bottom: 5px; font-size: 38px; text-shadow: 0 0 10px #ffffaa; text-transform: uppercase; letter-spacing: 3px; }
        #menu p.subtitle { margin-bottom: 25px; color: #ff3333; font-size: 14px; text-shadow: 0 0 5px #ff0000; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 300px; justify-content: space-between; color: white;}
        input { padding: 10px; font-size: 16px; border-radius: 2px; border: 1px solid #aa8822; background: #111; color: white; width: 150px; }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
        button#btnStart { padding: 15px 30px; font-size: 18px; font-weight: bold; border: 1px solid #ff3333; border-radius: 2px; cursor: pointer; background: #111; color: #ff3333; text-transform: uppercase; margin-top: 20px; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        button#btnStart:hover { background: #330000; box-shadow: 0 0 20px #ff0000; }
        
        #VRButton {
            position: absolute !important; bottom: 20px !important; left: 50% !important;
            transform: translateX(-50%) !important; padding: 15px 30px !important; font-size: 20px !important;
            font-weight: bold !important; background: #222 !important; color: #00ffcc !important;
            border: 2px solid #00ffcc !important; border-radius: 8px !important; cursor: pointer !important;
            z-index: 9999 !important; display: none;
        }
        .started #VRButton { display: block !important; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>BagaBoo VR</h1>
        <p class="subtitle">[ Perfected Fall Dynamics & 20x40x20m Arena ]</p>
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" value="Survivor" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#8B4513" /></div>
        <button id="btnStart">Enter Nightmare</button>
    </div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let myColor = "#8B4513";

        // ==========================================
        // 1. ENGINE & RENDERER SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0c10);
        scene.fog = new THREE.FogExp2(0x0a0c10, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0x334466, 0x111122, 0.8));

        const flashlight = new THREE.SpotLight(0xfff5b6, 90, 30, Math.PI / 4, 0.6, 1.5);
        camera.add(flashlight);
        const flashTarget = new THREE.Object3D(); flashTarget.position.set(0, 0, -1); camera.add(flashTarget);
        flashlight.target = flashTarget;

        const roomSize = { w: 20, d: 40, h: 20 };
        const playerRadius = 0.35;
        const playerPos = new THREE.Vector3(0, playerRadius, 0);
        const playerVel = new THREE.Vector3(0, 0, 0);

        // ==========================================
        // 2. HORROR AUDIO SYSTEM
        // ==========================================
        let audioCtx = null;

        function initHorrorSoundtrack() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            const subFilter = audioCtx.createBiquadFilter();

            subOsc.type = 'sawtooth';
            subOsc.frequency.setValueAtTime(36.7, audioCtx.currentTime);
            subFilter.type = 'lowpass';
            subFilter.frequency.setValueAtTime(120, audioCtx.currentTime);
            subGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

            subOsc.connect(subFilter);
            subFilter.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start();

            const padOsc1 = audioCtx.createOscillator();
            const padOsc2 = audioCtx.createOscillator();
            const padGain = audioCtx.createGain();
            const padFilter = audioCtx.createBiquadFilter();

            padOsc1.type = 'sine'; padOsc1.frequency.setValueAtTime(110, audioCtx.currentTime);
            padOsc2.type = 'triangle'; padOsc2.frequency.setValueAtTime(113, audioCtx.currentTime);

            padFilter.type = 'bandpass';
            padFilter.frequency.setValueAtTime(300, audioCtx.currentTime);
            padFilter.Q.setValueAtTime(5, audioCtx.currentTime);
            padGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

            padOsc1.connect(padFilter);
            padOsc2.connect(padFilter);
            padFilter.connect(padGain);
            padGain.connect(audioCtx.destination);
            padOsc1.start();
            padOsc2.start();

            setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                if (Math.random() < 0.35) {
                    const hitOsc = audioCtx.createOscillator();
                    const hitGain = audioCtx.createGain();
                    
                    hitOsc.type = 'square';
                    hitOsc.frequency.setValueAtTime(80 + Math.random() * 150, audioCtx.currentTime);
                    hitOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);

                    hitGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    hitGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

                    hitOsc.connect(hitGain);
                    hitGain.connect(audioCtx.destination);
                    hitOsc.start();
                    hitOsc.stop(audioCtx.currentTime + 0.8);
                }
            }, 6000);
        }

        function playFootstepSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(250, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // ==========================================
        // 3. ENVIRONMENT & OBSTACLES (20x40x20m)
        // ==========================================
        function createGridTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 512, 512);
            for (let i = 0; i <= 512; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 16);
            return tex;
        }

        const mats = {
            floor: new THREE.MeshLambertMaterial({ map: createGridTexture() }),
            wall: new THREE.MeshLambertMaterial({ color: 0x1e293b }),
            obstacle: new THREE.MeshLambertMaterial({ color: 0xb45309 }),
            pillar: new THREE.MeshLambertMaterial({ color: 0x334155 })
        };

        const internalObstacles = [];

        function addVisualBlock(x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); scene.add(mesh);
            internalObstacles.push({
                min: new THREE.Vector3(x - w/2, y - h/2, z - d/2),
                max: new THREE.Vector3(x + w/2, y + h/2, z + d/2)
            });
        }

        // Przeszkody wewnętrzne w hali 20x40x20m
        addVisualBlock(0, 10, 0, 2, 20, 2, mats.pillar);
        addVisualBlock(-5, 1.5, -10, 4, 3, 4, mats.obstacle);
        addVisualBlock(6, 2.5, 10, 5, 5, 3, mats.obstacle);
        addVisualBlock(-6, 4, 12, 2, 8, 2, mats.obstacle);
        addVisualBlock(5, 3, -12, 3, 6, 3, mats.obstacle);

        // ==========================================
        // 4. HANDS-ONLY AVATAR
        // ==========================================
        const controller1 = renderer.xr.getController(0); 
        const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1, controller2);

        const handGeo = new THREE.BoxGeometry(0.12, 0.06, 0.14);
        const handMat = new THREE.MeshLambertMaterial({ color: myColor });

        const leftHand = new THREE.Mesh(handGeo, handMat);
        const rightHand = new THREE.Mesh(handGeo, handMat);
        controller1.add(leftHand);
        controller2.add(rightHand);

        // ==========================================
        // 5. UI & START FLOW
        // ==========================================
        document.getElementById('btnStart').onclick = () => {
            myColor = document.getElementById('playerColor').value;
            handMat.color.set(myColor);
            document.body.classList.add('started');
            document.getElementById('menu').style.display = 'none';
            initHorrorSoundtrack();
        };

        // ==========================================
        // 6. ROBUST PHYSICS & CLEAN FALL DYNAMICS
        // ==========================================
        const prevLocal1 = new THREE.Vector3(); 
        const prevLocal2 = new THREE.Vector3();
        let lastStepTime = 0;
        const clock = new THREE.Clock();

        const FIXED_DT = 1 / 90;
        let accumulator = 0;

        function resolveCollisions() {
            // 1. Zewnętrzne granice pokoju (20x40x20m)
            const halfW = roomSize.w / 2;
            const halfD = roomSize.d / 2;

            if (playerPos.x < -halfW + playerRadius) { playerPos.x = -halfW + playerRadius; playerVel.x = 0; }
            if (playerPos.x > halfW - playerRadius) { playerPos.x = halfW - playerRadius; playerVel.x = 0; }

            if (playerPos.z < -halfD + playerRadius) { playerPos.z = -halfD + playerRadius; playerVel.z = 0; }
            if (playerPos.z > halfD - playerRadius) { playerPos.z = halfD - playerRadius; playerVel.z = 0; }

            if (playerPos.y < playerRadius) {
                playerPos.y = playerRadius;
                if (playerVel.y < 0) playerVel.y = 0;
            }
            if (playerPos.y > roomSize.h - playerRadius) {
                playerPos.y = roomSize.h - playerRadius;
                if (playerVel.y > 0) playerVel.y = 0;
            }

            // 2. Precyzyjne kolizje z przeszkodami wewnętrznymi (brak klejenia krawędzi)
            for (let i = 0; i < internalObstacles.length; i++) {
                const box = internalObstacles[i];

                const inX = playerPos.x >= box.min.x - playerRadius && playerPos.x <= box.max.x + playerRadius;
                const inZ = playerPos.z >= box.min.z - playerRadius && playerPos.z <= box.max.z + playerRadius;
                const inY = playerPos.y >= box.min.y - playerRadius && playerPos.y <= box.max.y + playerRadius;

                if (inX && inZ && inY) {
                    // Lądowanie na górze skrzyni/przeszkody
                    if (playerPos.y >= box.max.y - 0.3 && playerPos.y <= box.max.y + playerRadius + 0.3 && playerVel.y <= 0) {
                        playerPos.y = box.max.y + playerRadius;
                        playerVel.y = 0;
                    } else {
                        // Wypchnięcie poziome ze ścianek przeszkody
                        const penX1 = playerPos.x - (box.min.x - playerRadius);
                        const penX2 = (box.max.x + playerRadius) - playerPos.x;
                        const penZ1 = playerPos.z - (box.min.z - playerRadius);
                        const penZ2 = (box.max.z + playerRadius) - playerPos.z;

                        const minPen = Math.min(penX1, penX2, penZ1, penZ2);
                        if (minPen === penX1) { playerPos.x = box.min.x - playerRadius; playerVel.x = 0; }
                        else if (minPen === penX2) { playerPos.x = box.max.x + playerRadius; playerVel.x = 0; }
                        else if (minPen === penZ1) { playerPos.z = box.min.z - playerRadius; playerVel.z = 0; }
                        else if (minPen === penZ2) { playerPos.z = box.max.z + playerRadius; playerVel.z = 0; }
                    }
                }
            }
        }

        function processMovement(ctrl, prevPos) {
            const currPos = ctrl.position.clone();
            if (prevPos.lengthSq() > 0) {
                const deltaLocal = new THREE.Vector3().subVectors(currPos, prevPos);
                if (deltaLocal.lengthSq() > 0.000001) {
                    const handWorld = new THREE.Vector3();
                    ctrl.getWorldPosition(handWorld);

                    let touch = (handWorld.y <= 0.85);
                    if (!touch) {
                        for (let i = 0; i < internalObstacles.length; i++) {
                            const b = internalObstacles[i];
                            if (handWorld.x >= b.min.x - 0.2 && handWorld.x <= b.max.x + 0.2 &&
                                handWorld.y >= b.min.y - 0.2 && handWorld.y <= b.max.y + 0.2 &&
                                handWorld.z >= b.min.z - 0.2 && handWorld.z <= b.max.z + 0.2) {
                                touch = true; break;
                            }
                        }
                    }

                    if (touch) {
                        const deltaWorld = deltaLocal.clone().applyQuaternion(playerRig.quaternion);
                        playerVel.addScaledVector(deltaWorld, -45.0);

                        const now = clock.getElapsedTime();
                        if (now - lastStepTime > 0.15) {
                            playFootstepSound();
                            lastStepTime = now;
                        }
                    }
                }
            }
            prevPos.copy(currPos);
        }

        function physicsStep(dt) {
            if (renderer.xr.isPresenting) {
                processMovement(controller1, prevLocal1);
                processMovement(controller2, prevLocal2);
            }

            // Stabilna grawitacja bez zakłóceń w locie
            playerVel.y -= 25.0 * dt; 
            playerVel.multiplyScalar(0.96);

            playerPos.addScaledVector(playerVel, dt);

            resolveCollisions();
        }

        renderer.setAnimationLoop(() => {
            const frameDelta = clock.getDelta();
            accumulator += Math.min(frameDelta, 0.1);

            while (accumulator >= FIXED_DT) {
                physicsStep(FIXED_DT);
                accumulator -= FIXED_DT;
            }

            playerRig.position.set(
                playerPos.x - camera.position.x,
                playerPos.y - playerRadius,
                playerPos.z - camera.position.z
            );

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
