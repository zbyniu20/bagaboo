<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagaBoo VR - Daylight Horror Parkour</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #9db2c2; font-family: sans-serif; }
        
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #b1c6d6, #5a6e7e); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #111;
        }
        
        #lobby h1.logo { 
            font-family: 'Creepster', cursive; 
            font-size: 85px; 
            color: #880000; 
            margin-bottom: 5px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #fff, 0 0 15px rgba(255, 0, 0, 0.6);
        }

        #lobby p.subtitle { margin-bottom: 30px; color: #330000; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 340px; justify-content: space-between; }
        .form-group label { font-weight: bold; color: #222; }
        input, select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #995555; background: #f0e0e0; color: #111; width: 180px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1); }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; border: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; justify-content: center; max-width: 500px;}
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; border: 1px solid #aa0000; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-transform: uppercase; }
        
        #btnHost { background: #880000; color: #ffffff; }
        #btnJoin { background: #aa0000; color: white; }
        #btnSolo { background: #4a5c6a; color: white; border-color: #3b4d5b; }
        
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(150,0,0,0.3); }
        #btnSolo:hover { background: #5a6e7e; box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        
        button:disabled { background: #aa8888 !important; color: #ffdddd !important; border-color: #997777 !important; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status { margin-top: 25px; font-weight: bold; font-size: 16px; color: #440000; text-align: center; max-width: 400px; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #ffffff; font-weight: bold; font-size: 18px; z-index: 100; text-shadow: 2px 2px 4px black; display: none; }
        
        #VRButton { display: none !important; }
        .connected #VRButton { display: block !important; border-color: #ff0000 !important; color: #ff0000 !important; background: rgba(50,10,10,0.8) !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="lobby">
        <h1 class="logo">BagaBoo VR</h1>
        <p class="subtitle">Daylight Parkour | Don't Look Away</p>
        
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" placeholder="Player1" value="Bagaboo" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#3d2314" /></div>
        <div class="form-group">
            <label>Hat:</label>
            <select id="playerHat">
                <option value="none">None</option>
                <option value="tophat">Top Hat</option>
                <option value="cap">Baseball Cap</option>
            </select>
        </div>
        <div class="form-group">
            <label>Glasses:</label>
            <select id="playerGlasses">
                <option value="none">None</option>
                <option value="sunglasses">Sunglasses</option>
            </select>
        </div>
        <div class="form-group" style="margin-top: 15px;"><label>Room Code:</label><input type="text" id="roomCode" placeholder="e.g. nightmare" /></div>
        
        <div class="btn-group">
            <button id="btnHost">Host Game</button>
            <button id="btnJoin">Join Game</button>
            <button id="btnSolo">Play Solo</button>
        </div>
        <div id="status">Checking microphone...</div>
    </div>

    <div id="info">Connected! Climb the bleeding walls...</div>
    <div id="audio-container" style="display:none;"></div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // USTAWIENIA GRAFIKI
        // ==========================================
        const GFX = {
            muralRes: 1536,
            shadowMap: 1024,
            exposure: 1.1,
            ambient: 0.9,
            fogDensity: 0.010,
            mannequins: 10,
            dust: 700,
            chains: 16
        };

        // --- GLOBAL VARIABLES ---
        let myProfile = { name: "Bagaboo", color: "#3d2314", hat: "none", glasses: "none" };
        let myStream = null;
        let audioCtx = null;

        const statusDiv = document.getElementById('status');
        
        async function initMic() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    statusDiv.innerText = "Mic access granted. Ready to play.";
                } else {
                    statusDiv.innerText = "Mic not supported (HTTPS required). Voice disabled.";
                }
            } catch (err) {
                statusDiv.innerText = "Mic access denied. Voice chat disabled.";
            }
        }
        initMic();

        // --- DARK HORROR SOUNDTRACK ---
        function initHorrorSoundtrack() {
            if(audioCtx) return; 
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            const subFilter = audioCtx.createBiquadFilter();

            subOsc.type = 'sawtooth'; subOsc.frequency.setValueAtTime(35.0, audioCtx.currentTime);
            subFilter.type = 'lowpass'; subFilter.frequency.setValueAtTime(100, audioCtx.currentTime);
            subGain.gain.setValueAtTime(0.3, audioCtx.currentTime);

            subOsc.connect(subFilter); subFilter.connect(subGain); subGain.connect(audioCtx.destination);
            subOsc.start();

            const padOsc1 = audioCtx.createOscillator(); const padOsc2 = audioCtx.createOscillator();
            const padGain = audioCtx.createGain(); const padFilter = audioCtx.createBiquadFilter();

            padOsc1.type = 'sine'; padOsc1.frequency.setValueAtTime(110, audioCtx.currentTime);
            padOsc2.type = 'triangle'; padOsc2.frequency.setValueAtTime(113, audioCtx.currentTime);

            padFilter.type = 'bandpass'; padFilter.frequency.setValueAtTime(350, audioCtx.currentTime); padFilter.Q.setValueAtTime(5, audioCtx.currentTime);
            padGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            padOsc1.connect(padFilter); padOsc2.connect(padFilter); padFilter.connect(padGain); padGain.connect(audioCtx.destination);
            padOsc1.start(); padOsc2.start();
        }

        // ==========================================
        // PROCEDURALNE TEKSTURY I WEKTOROWE MURALE
        // ==========================================
        function mkRng(seed) {
            let a = seed >>> 0;
            return function() {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
        function toTex(c, repeat) {
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = 16;
            if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
            return t;
        }

        function handPrint(ctx, x, y, s, rot, R) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
            ctx.fillStyle = 'rgba(105,0,0,0.65)';
            ctx.beginPath(); ctx.ellipse(0, 0, 26, 32, 0, 0, 7); ctx.fill();
            const lens = [30, 42, 48, 44, 32];
            for (let i = 0; i < 5; i++) {
                const ang = -Math.PI / 2 + (i - 2) * 0.4;
                const len = lens[i];
                const fx = Math.cos(ang) * (30 + len / 2), fy = Math.sin(ang) * (30 + len / 2);
                ctx.beginPath(); ctx.ellipse(fx, fy, 8, len / 2, ang + Math.PI / 2, 0, 7); ctx.fill();
            }
            ctx.fillRect(-9, 30, 6, 60 + R() * 80);
            ctx.restore();
        }

        function createWallTexture() {
            const S = 1024, c = makeCanvas(S, S), ctx = c.getContext('2d'), R = mkRng(1337);
            ctx.fillStyle = '#5d6266'; ctx.fillRect(0, 0, S, S);
            for (let i = 0; i < 70000; i++) {
                ctx.fillStyle = R() > 0.5 ? 'rgba(0,0,0,' + (R() * 0.18) + ')' : 'rgba(255,255,255,' + (R() * 0.05) + ')';
                ctx.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2);
            }
            for (let i = 0; i < 46; i++) {
                const x = R() * S, y = R() * S, r = 60 + R() * 180;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, R() > 0.35 ? 'rgba(10,6,6,0.22)' : 'rgba(140,140,150,0.07)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            for (let i = 0; i <= S; i += 256) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(i - 2, 0, 4, S); ctx.fillRect(0, i - 2, S, 4);
                ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(i + 2, 0, 2, S); ctx.fillRect(0, i + 2, S, 2);
            }
            for (let x = 0; x <= S; x += 256) for (let y = 0; y <= S; y += 256) {
                for (const o of [[14, 14], [-14, 14], [14, -14], [-14, -14]]) {
                    ctx.fillStyle = 'rgba(20,20,22,0.8)'; ctx.beginPath(); ctx.arc(x + o[0], y + o[1], 4, 0, 7); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(x + o[0] - 1, y + o[1] - 1, 1.6, 0, 7); ctx.fill();
                }
            }
            for (let i = 0; i < 16; i++) {
                const x = R() * S, w = 8 + R() * 26, y = R() * S * 0.6, l = 160 + R() * 420;
                const g = ctx.createLinearGradient(0, y, 0, y + l);
                g.addColorStop(0, 'rgba(110,50,18,0.4)'); g.addColorStop(1, 'rgba(110,50,18,0)');
                ctx.fillStyle = g; ctx.fillRect(x, y, w, l);
            }
            ctx.lineCap = 'round';
            for (let i = 0; i < 12; i++) {
                let x = R() * S, y = R() * S, a = R() * 6.28;
                ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1 + R() * 1.8;
                ctx.beginPath(); ctx.moveTo(x, y);
                for (let k = 0; k < 28; k++) { a += (R() - 0.5) * 1.0; x += Math.cos(a) * (8 + R() * 14); y += Math.sin(a) * (8 + R() * 14); ctx.lineTo(x, y); }
                ctx.stroke();
            }
            for (let i = 0; i < 14; i++) {
                const x = R() * S, y = R() * S * 0.5, l = 80 + R() * 320, w = 5 + R() * 10;
                ctx.fillStyle = 'rgba(88,0,0,0.7)'; ctx.fillRect(x - w / 2, y, w, l);
                ctx.beginPath(); ctx.arc(x, y + l, w * 0.8, 0, 7); ctx.fill();
                ctx.fillStyle = 'rgba(150,10,10,0.25)'; ctx.fillRect(x - w / 2, y, w * 0.3, l);
            }
            for (let i = 0; i < 24; i++) {
                const x = R() * S, y = R() * S, r = 3 + R() * 18;
                ctx.fillStyle = 'rgba(95,0,0,0.6)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
                for (let k = 0; k < 7; k++) { const a = R() * 6.28, d = r + R() * r * 3; ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 1 + R() * 3, 0, 7); ctx.fill(); }
            }
            for (let i = 0; i < 4; i++) handPrint(ctx, 100 + R() * (S - 200), 140 + R() * (S - 300), 0.7 + R() * 0.5, R() * 0.8 - 0.4, R);
            const vg = ctx.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.75);
            vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.35)');
            ctx.fillStyle = vg; ctx.fillRect(0, 0, S, S);
            return toTex(c, true);
        }

        function createFloorTexture() {
            const S = 1024, c = makeCanvas(S, S), ctx = c.getContext('2d'), R = mkRng(4242);
            for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) {
                const v = (R() * 18) | 0;
                ctx.fillStyle = 'rgb(' + (74 + v) + ',' + (72 + v) + ',' + (70 + v) + ')';
                ctx.fillRect(tx * 256, ty * 256, 256, 256);
            }
            for (let i = 0; i < 60000; i++) {
                ctx.fillStyle = R() > 0.5 ? 'rgba(0,0,0,' + (R() * 0.2) + ')' : 'rgba(255,255,255,' + (R() * 0.04) + ')';
                ctx.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2);
            }
            for (let i = 0; i < 40; i++) {
                const x = R() * S, y = R() * S, r = 40 + R() * 150;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(8,4,4,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            for (let i = 0; i <= 4; i++) { ctx.fillRect(i * 256 - 3, 0, 6, S); ctx.fillRect(0, i * 256 - 3, S, 6); }
            ctx.lineCap = 'round';
            for (let i = 0; i < 6; i++) {
                ctx.strokeStyle = 'rgba(75,0,0,' + (0.35 + R() * 0.3) + ')'; ctx.lineWidth = 14 + R() * 26;
                const x0 = R() * S, y0 = R() * S;
                ctx.beginPath(); ctx.moveTo(x0, y0);
                ctx.bezierCurveTo(x0 + R() * 300 - 150, y0 + R() * 300 - 150, x0 + R() * 400 - 200, y0 + R() * 400 - 200, x0 + R() * 500 - 250, y0 + R() * 500 - 250);
                ctx.stroke();
            }
            for (let i = 0; i < 14; i++) {
                let x = R() * S, y = R() * S, a = R() * 6.28;
                ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1 + R() * 2;
                ctx.beginPath(); ctx.moveTo(x, y);
                for (let k = 0; k < 24; k++) { a += (R() - 0.5) * 1.1; x += Math.cos(a) * (8 + R() * 14); y += Math.sin(a) * (8 + R() * 14); ctx.lineTo(x, y); }
                ctx.stroke();
            }
            for (let i = 0; i < 40; i++) {
                const x = R() * S, y = R() * S, r = 2 + R() * 9;
                ctx.fillStyle = 'rgba(90,0,0,0.55)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
            }
            return toTex(c, true);
        }

        function createPlasterTexture() {
            const S = 512, c = makeCanvas(S, S), ctx = c.getContext('2d'), R = mkRng(77);
            ctx.fillStyle = '#cdc5b6'; ctx.fillRect(0, 0, S, S);
            for (let i = 0; i < 20000; i++) {
                ctx.fillStyle = 'rgba(' + (R() > 0.5 ? '0,0,0' : '255,255,255') + ',' + (R() * 0.07) + ')';
                ctx.fillRect(R() * S, R() * S, 1 + R() * 2, 1 + R() * 2);
            }
            for (let i = 0; i < 14; i++) {
                const x = R() * S, y = R() * S, r = 30 + R() * 90;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(70,50,30,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            ctx.lineCap = 'round';
            for (let i = 0; i < 16; i++) {
                let x = R() * S, y = R() * S, a = R() * 6.28;
                ctx.strokeStyle = 'rgba(30,20,15,0.8)'; ctx.lineWidth = 0.8 + R() * 1.4;
                ctx.beginPath(); ctx.moveTo(x, y);
                for (let k = 0; k < 20; k++) { a += (R() - 0.5) * 1.1; x += Math.cos(a) * (5 + R() * 10); y += Math.sin(a) * (5 + R() * 10); ctx.lineTo(x, y); }
                ctx.stroke();
            }
            for (let i = 0; i < 14; i++) {
                const x = R() * S, y = R() * S * 0.6, l = 40 + R() * 200, w = 2 + R() * 5;
                ctx.fillStyle = 'rgba(110,8,8,0.75)'; ctx.fillRect(x, y, w, l);
                ctx.beginPath(); ctx.arc(x + w / 2, y + l, w * 0.9, 0, 7); ctx.fill();
            }
            return toTex(c, true);
        }

        function createBloodPoolTexture() {
            const S = 512, c = makeCanvas(S, S), ctx = c.getContext('2d'), R = mkRng(909);
            ctx.fillStyle = '#3d0000';
            for (let i = 0; i < 30; i++) {
                const a = R() * 6.28, d = R() * 100, r = 35 + R() * 70;
                ctx.beginPath(); ctx.arc(256 + Math.cos(a) * d, 256 + Math.sin(a) * d, r, 0, 7); ctx.fill();
            }
            ctx.fillStyle = 'rgba(110,5,5,0.5)';
            for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.arc(230 + R() * 50, 230 + R() * 50, 20 + R() * 40, 0, 7); ctx.fill(); }
            ctx.globalCompositeOperation = 'destination-in';
            const m = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            m.addColorStop(0, 'rgba(255,255,255,1)'); m.addColorStop(0.62, 'rgba(255,255,255,0.95)'); m.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = m; ctx.fillRect(0, 0, S, S);
            return toTex(c, false);
        }

        function createDotTexture() {
            const c = makeCanvas(64, 64), ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        function createEyeballTexture() {
            const c = document.createElement('canvas'); c.width=256; c.height=256; const ctx=c.getContext('2d');
            ctx.fillStyle='#dddddd'; ctx.fillRect(0,0,256,256);
            ctx.strokeStyle='#aa0000'; ctx.lineWidth=2;
            for(let i=0; i<40; i++) {
                ctx.beginPath(); ctx.moveTo(128,128); ctx.lineTo(128 + Math.cos(i)*256, 128 + Math.sin(i)*256); ctx.stroke();
            }
            ctx.fillStyle='#440000'; ctx.beginPath(); ctx.arc(128,128,40,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#000000'; ctx.beginPath(); ctx.arc(128,128,15,0,Math.PI*2); ctx.fill();
            return new THREE.CanvasTexture(c);
        }

        // ---------- WEKTOROWE POTWORY (rysowane krzywymi na canvasie) ----------
        function glowEye(ctx, x, y, r, col, slit) {
            if (slit === undefined) slit = true;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
            g.addColorStop(0, col + 'cc'); g.addColorStop(1, col + '00');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
            ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, r * 1.15, r * 0.8, 0, 0, 7); ctx.fill();
            ctx.fillStyle = '#fff7d0'; ctx.beginPath(); ctx.ellipse(x, y, r * 0.55, r * 0.4, 0, 0, 7); ctx.fill();
            if (slit) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, y, r * 0.16, r * 0.75, 0, 0, 7); ctx.fill(); }
        }

        function paintBackdrop(ctx, R, glow) {
            const g = ctx.createRadialGradient(512, 512, 40, 512, 512, 540);
            g.addColorStop(0, 'rgba(14,0,0,0.97)'); g.addColorStop(0.7, 'rgba(8,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
            if (glow) {
                const h = ctx.createRadialGradient(512, 470, 10, 512, 470, 430);
                h.addColorStop(0, glow); h.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = h; ctx.fillRect(0, 0, 1024, 1024);
            }
            ctx.lineCap = 'round';
            for (let i = 0; i < 40; i++) {
                const a = R() * 6.283, r1 = 420 + R() * 80, l = 30 + R() * 120;
                const x = 512 + Math.cos(a) * r1, y = 512 + Math.sin(a) * r1;
                ctx.strokeStyle = 'rgba(100,0,0,' + (0.25 + R() * 0.4) + ')'; ctx.lineWidth = 2 + R() * 9;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l * 0.3, y + Math.sin(a) * l * 0.3 + l * 0.6); ctx.stroke();
            }
        }

        function bloodText(ctx, txt, x, y, size) {
            ctx.save();
            ctx.font = 'bold ' + size + 'px serif'; ctx.textAlign = 'center';
            if ('letterSpacing' in ctx) ctx.letterSpacing = '8px';
            ctx.fillStyle = '#7a0000'; ctx.strokeStyle = '#200000'; ctx.lineWidth = 4;

        const ARM_POSES = [

            const pose = ARM_POSES[(R() * ARM_POSES.length) | 0](s);
            const E = S.clone().add(pose[0]).add(jit(R, 0.05));
            const W = E.clone().add(pose[1]).add(jit(R, 0.05));
            body.push(seg(S, E, 0.038, 0.032, 7)); body.push(seg(E, W, 0.032, 0.026, 7));
            joints.push(place(UNIT_SPHERE, E.x, E.y, E.z, 0, 0, 0, 0.038, 0.038, 0.038));
            joints.push(place(UNIT_SPHERE, W.x, W.y, W.z, 0, 0, 0, 0.03, 0.03, 0.03));
            const d = new THREE.Vector3().subVectors(W, E).normalize();
            const palmEnd = W.clone().addScaledVector(d, 0.085);
            body.push(seg(W, palmEnd, 0.026, 0.022, 5));
            const p = new THREE.Vector3().crossVectors(d, V3(0, 1, 0));
            if (p.lengthSq() < 0.01) p.set(1, 0, 0);
            p.normalize();
            for (let i = 0; i < 5; i++) {

                const d1 = d.clone().addScaledVector(p, (i - 2) * 0.15).add(jit(R, 0.3)).normalize();

            camera.getWorldPosition(_cp); camera.getWorldDirection(_cd);
            for (const m of mannequins) {
                _tm.set(m.group.position.x - _cp.x, 1.0 - _cp.y, m.group.position.z - _cp.z);
                const dist = _tm.length();
                if (dist < 0.001 || dist > 16) continue;
                _tm.multiplyScalar(1 / dist);
                if (_cd.dot(_tm) > 0.42) continue; // widzisz go: stoi nieruchomo
                const target = Math.atan2(_cp.x - m.group.position.x, _cp.z - m.group.position.z);
                let d = target - m.group.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
                const rate = (dist < 5 ? 1.6 : 0.7) * dt;
                m.group.rotation.y += Math.max(-rate, Math.min(rate, d));
                let hd = Math.atan2(Math.sin(target - m.group.rotation.y), Math.cos(target - m.group.rotation.y));
                hd = Math.max(-2.4, Math.min(2.4, hd));
                const hr = 3.0 * dt;
                m.head.rotation.y += Math.max(-hr, Math.min(hr, hd - m.head.rotation.y));
            }
        }

        function addGutsRope(x, y, z, height) {
            const ropeGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x6a1515, roughness: 0.25, metalness: 0.1 }); 
            const geo = new THREE.CylinderGeometry(0.12, 0.12, height, 12, Math.max(20, Math.round(height * 6)));
            const pa = geo.attributes.position;
            for (let i = 0; i < pa.count; i++) {
                const yy = pa.getY(i), k = 1 + 0.2 * Math.sin(yy * 9) + 0.1 * Math.sin(yy * 23 + 1.3);
                pa.setX(i, pa.getX(i) * k); pa.setZ(i, pa.getZ(i) * k);
            }
            geo.computeVertexNormals();
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true; ropeGroup.add(mesh); scene.add(ropeGroup);
            
            const shape = new CANNON.Box(new CANNON.Vec3(0.12, height/2, 0.12));
            const body = new CANNON.Body({ 
                mass: 10, shape: shape, material: physicsMat, position: new CANNON.Vec3(x, y - height/2, z),
                linearDamping: 0.4, angularDamping: 0.4, collisionFilterGroup: GROUP_ROPE, collisionFilterMask: GROUP_ENV | GROUP_BALL

        }

        function onSqueezeStart(event) {

        // ==========================================
        // 7. MOVEMENT, SOLID COLLISION & ANTI-SLIP
        // ==========================================
        let prevLocalPos1 = new THREE.Vector3(); let prevLocalPos2 = new THREE.Vector3();
        const clock = new THREE.Clock();

        const POWER = 1.2;            // siła odepchnięcia i skoku (1.0 = oryginał, 1.2 = +20%)
        const HEAD_RADIUS = 0.18;     // kolizja głowy
        const FRICTION_IDLE = 0.2;    // hamowanie poziome na pod-krok, gdy stoisz (mniej = mocniej)
        const FRICTION_PUSH = 0.93;   // hamowanie, gdy aktywnie odpychasz się rękami
        const HAND_DEADZONE = 0.004;  // minimalny ruch ręki na klatkę (m), poniżej = drżenie, ignorujemy
        let grounded = false;
        let handPushing = false;
        let stepped = false;
        const hit = { nx: 0, ny: 0, nz: 0, depth: 0 };

        function sphereVsBox(px, py, pz, r, b) {
            const cx = Math.max(b.min.x, Math.min(px, b.max.x));
            const cy = Math.max(b.min.y, Math.min(py, b.max.y));
            const cz = Math.max(b.min.z, Math.min(pz, b.max.z));
            const dx = px - cx, dy = py - cy, dz = pz - cz;
            const d2 = dx*dx + dy*dy + dz*dz;
            if (d2 >= r*r) return false;
            if (d2 > 1e-12) {
                const d = Math.sqrt(d2);
                hit.nx = dx/d; hit.ny = dy/d; hit.nz = dz/d; hit.depth = r - d;
            } else {
                const c = [px - b.min.x, b.max.x - px, py - b.min.y, b.max.y - py, pz - b.min.z, b.max.z - pz];
                let i = 0; for (let k = 1; k < 6; k++) if (c[k] < c[i]) i = k;
                hit.nx = hit.ny = hit.nz = 0;
                if (i === 0) hit.nx = -1; else if (i === 1) hit.nx = 1;
                else if (i === 2) hit.ny = -1; else if (i === 3) hit.ny = 1;
                else if (i === 4) hit.nz = -1; else hit.nz = 1;
                hit.depth = c[i] + r;
            }
            return true;
        }

        function pushOut(p, v) {
            p.x += hit.nx * hit.depth; p.y += hit.ny * hit.depth; p.z += hit.nz * hit.depth;
            const vn = v.x*hit.nx + v.y*hit.ny + v.z*hit.nz;
            if (vn < 0) { v.x -= vn*hit.nx; v.y -= vn*hit.ny; v.z -= vn*hit.nz; }
        }

        world.addEventListener('postStep', () => {
            stepped = true;
            const p = playerBody.position, v = playerBody.velocity;

            for (let pass = 0; pass < 3; pass++) {
                let any = false;
                for (const o of obstacles) {
                    if (sphereVsBox(p.x, p.y, p.z, radius, o.box3)) { pushOut(p, v); any = true; }
                }
                if (!any) break;
            }

            if (renderer.xr.isPresenting) {
                const headY = camera.position.y - radius - gorillaStanceOffset;
                if (headY > 0.1) {
                    for (const o of obstacles) {
                        if (sphereVsBox(p.x, p.y + headY, p.z, HEAD_RADIUS, o.box3)) pushOut(p, v);
                    }
                }
            }

            grounded = false;
            for (const o of obstacles) {
                if (sphereVsBox(p.x, p.y, p.z, radius + 0.03, o.box3) && hit.ny > 0.5) { grounded = true; break; }
            }

            if (grounded && !activeRopeConstraint) {
                const k = handPushing ? FRICTION_PUSH : FRICTION_IDLE;
                v.x *= k; v.z *= k;
                if (!handPushing) {
                    if (Math.abs(v.x) < 0.05) v.x = 0;
                    if (Math.abs(v.z) < 0.05) v.z = 0;
                }
            }

            const maxV = 12 * POWER;
            const s2 = v.lengthSquared();
            if (s2 > maxV * maxV) v.scale(maxV / Math.sqrt(s2), v);
        });

        function clampHandVisual(controller, handMesh) {
            const pos = new THREE.Vector3(); controller.getWorldPosition(pos);
            const quat = new THREE.Quaternion(); controller.getWorldQuaternion(quat);
            
            handMesh.position.copy(pos);
            handMesh.quaternion.copy(quat);
            
            const hRad = 0.08;
            for(let obs of obstacles) {
                const box = obs.box3;
                if (handMesh.position.x > box.min.x - hRad && handMesh.position.x < box.max.x + hRad &&
                    handMesh.position.y > box.min.y - hRad && handMesh.position.y < box.max.y + hRad &&
                    handMesh.position.z > box.min.z - hRad && handMesh.position.z < box.max.z + hRad) {
                    
                    const px1 = handMesh.position.x - (box.min.x - hRad);
                    const px2 = (box.max.x + hRad) - handMesh.position.x;
                    const py1 = handMesh.position.y - (box.min.y - hRad);
                    const py2 = (box.max.y + hRad) - handMesh.position.y;
                    const pz1 = handMesh.position.z - (box.min.z - hRad);
                    const pz2 = (box.max.z + hRad) - handMesh.position.z;
                    
                    const min = Math.min(px1, px2, py1, py2, pz1, pz2);
                    if (min === px1) handMesh.position.x = box.min.x - hRad;
                    else if (min === px2) handMesh.position.x = box.max.x + hRad;
                    else if (min === py1) handMesh.position.y = box.min.y - hRad;
                    else if (min === py2) handMesh.position.y = box.max.y + hRad;
                    else if (min === pz1) handMesh.position.z = box.min.z - hRad;
                    else if (min === pz2) handMesh.position.z = box.max.z + hRad;
                }
            }
        }

        function handleMovement(controller, handMesh, prevLocalPos) {
            const currentLocalPos = controller.position.clone();
            
            if (prevLocalPos.lengthSq() > 0 && !activeRopeConstraint) {
                const deltaLocalPos = new THREE.Vector3().subVectors(currentLocalPos, prevLocalPos);
                const handWorldPos = new THREE.Vector3(); 
                handMesh.getWorldPosition(handWorldPos);

                let isTouchingGround = false;
                let isTouchingWall = false;
                
                if (handWorldPos.y <= 0.25) {
                    isTouchingGround = true;
                } else {
                    for(let obs of obstacles) {
                        if (obs.box3.distanceToPoint(handWorldPos) <= 0.3) { 
                            if (handWorldPos.y > obs.box3.min.y + 0.15) { isTouchingWall = true; } else { isTouchingGround = true; }
                            break; 
                        }
                    }
                }

                for(let t of trampolines) {
                    if (t.box3.distanceToPoint(handWorldPos) <= 0.25) {
                        playerBody.velocity.y = 12 * POWER; isTouchingGround = false; isTouchingWall = false; break;
                    }
                }

                const dl = deltaLocalPos.length();
                if ((isTouchingGround || isTouchingWall) && dl > HAND_DEADZONE) {
                    deltaLocalPos.multiplyScalar((dl - HAND_DEADZONE) / dl);

                    const deltaWorld = deltaLocalPos.clone().applyQuaternion(playerRig.quaternion);
                    if(deltaWorld.length() > 0.4 * POWER) deltaWorld.normalize().multiplyScalar(0.4 * POWER);

                    let pushForceXZ = -650 * POWER; 
                    let pushForceY = -650 * POWER;

                    if (isTouchingWall) {
                        pushForceY = -800 * POWER; pushForceXZ = -700 * POWER;
                    }

                    playerBody.applyImpulse(
                        new CANNON.Vec3(deltaWorld.x * pushForceXZ, deltaWorld.y * pushForceY, deltaWorld.z * pushForceXZ), 
                        playerBody.position
                    );
                    handPushing = true;
                }
            }
            prevLocalPos.copy(currentLocalPos);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.1); 
            const t = clock.elapsedTime;
            world.step(1/90, dt, 10); 
            if (stepped) { handPushing = false; stepped = false; }

            if(playerBody.position.x < -14.6) { playerBody.position.x = -14.6; playerBody.velocity.x = 0; }
            if(playerBody.position.x > 14.6) { playerBody.position.x = 14.6; playerBody.velocity.x = 0; }
            if(playerBody.position.z < -14.6) { playerBody.position.z = -14.6; playerBody.velocity.z = 0; }
            if(playerBody.position.z > 14.6) { playerBody.position.z = 14.6; playerBody.velocity.z = 0; }
            if(playerBody.position.y < radius) { playerBody.position.y = radius; if(playerBody.velocity.y < 0) playerBody.velocity.y = 0; }
            if(playerBody.position.y > 19.6) { playerBody.position.y = 19.6; if(playerBody.velocity.y > 0) playerBody.velocity.y = 0; }

            if (renderer.xr.isPresenting) {
                clampHandVisual(controller1, localAvatar.handL);
                clampHandVisual(controller2, localAvatar.handR);

                handleMovement(controller1, localAvatar.handL, prevLocalPos1); 
                handleMovement(controller2, localAvatar.handR, prevLocalPos2);
            }
            
            if(grabbedObject && grabbingController) {
                const ctrlPos = new THREE.Vector3(); grabbingController.getWorldPosition(ctrlPos); grabbedObject.userData.body.position.copy(ctrlPos);
            }
            for(let ball of throwables) { ball.position.copy(ball.userData.body.position); ball.quaternion.copy(ball.userData.body.quaternion); }
            
            for(let rope of ropes) {
                rope.mesh.position.copy(rope.body.position); rope.mesh.quaternion.copy(rope.body.quaternion);
            }

            for (let i = 0; i < muralMats.length; i++) muralMats[i].emissiveIntensity = 0.5 + 0.1 * Math.sin(t * 1.1 + i * 1.7);
            for (let i = 0; i < dustN; i++) {
                dustPos[i * 3] += Math.sin(t * 0.4 + dustPh[i]) * 0.12 * dt;
                dustPos[i * 3 + 2] += Math.cos(t * 0.35 + dustPh[i]) * 0.12 * dt;
                dustPos[i * 3 + 1] -= dustVy[i] * dt;
                if (dustPos[i * 3 + 1] < 0.2) dustPos[i * 3 + 1] = 19.5;
            }
            dustGeo.attributes.position.needsUpdate = true;
            updateMannequins(dt);

            const camLocalPos = camera.position.clone();

            playerRig.position.set(
                playerBody.position.x - camLocalPos.x,
                playerBody.position.y - radius - gorillaStanceOffset,
                playerBody.position.z - camLocalPos.z
            );

            const camWorldPos = new THREE.Vector3(); camera.getWorldPosition(camWorldPos);
            const camWorldQuat = new THREE.Quaternion(); camera.getWorldQuaternion(camWorldQuat);
            const euler = new THREE.Euler().setFromQuaternion(camWorldQuat, "YXZ");
            
            localAvatar.torso.position.copy(camWorldPos).add(new THREE.Vector3(0, -0.35, 0));
            localAvatar.torso.rotation.set(0, euler.y, 0);

            renderer.render(scene, camera);
        });
    </script>
</body>
