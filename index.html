<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagaBoo VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a2a20, #0a0a08); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; color: #d4d4aa;
        }
        #menu h1 { margin-bottom: 5px; font-size: 38px; text-shadow: 0 0 10px #ffffaa; text-transform: uppercase; letter-spacing: 3px; }
        #menu p.subtitle { margin-bottom: 25px; color: #aaa; font-size: 14px; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 300px; justify-content: space-between; color: white;}
        input { padding: 10px; font-size: 16px; border-radius: 2px; border: 1px solid #aa8822; background: #111; color: white; width: 150px; }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
        button#btnStart { padding: 15px 30px; font-size: 18px; font-weight: bold; border: 1px solid #aa8822; border-radius: 2px; cursor: pointer; background: #111; color: #aa8822; text-transform: uppercase; margin-top: 20px; }
        button#btnStart:hover { background: #332200; box-shadow: 0 0 15px #aa8822; }
        
        #VRButton {
            position: absolute !important; bottom: 20px !important; left: 50% !important;
            transform: translateX(-50%) !important; padding: 15px 30px !important; font-size: 20px !important;
            font-weight: bold !important; background: #222 !important; color: #00ffcc !important;
            border: 2px solid #00ffcc !important; border-radius: 8px !important; cursor: pointer !important;
            z-index: 9999 !important; display: none;
        }
        .started #VRButton { display: block !important; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>BagaBoo VR</h1>
        <p class="subtitle">Gorilla Tag Style Prototype</p>
        <div class="form-group"><label>Nickname:</label><input type="text" id="playerName" value="Survivor" /></div>
        <div class="form-group"><label>Fur Color:</label><input type="color" id="playerColor" value="#8B4513" /></div>
        <button id="btnStart">Start Game</button>
    </div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let myColor = "#8B4513";

        // ==========================================
        // 1. ENGINE & RENDERER SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x11161c);
        scene.fog = new THREE.FogExp2(0x11161c, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
        const playerRig = new THREE.Group(); playerRig.add(camera); scene.add(playerRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.8));

        // Physics State (Smooth Momentum)
        const playerPos = new THREE.Vector3(0, 0, 0);
        const playerVel = new THREE.Vector3(0, 0, 0);
        const playerRadius = 0.35;

        // ==========================================
        // 2. HIGH-CONTRAST ENVIRONMENT
        // ==========================================
        function createGridTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 512, 512);
            for (let i = 0; i <= 512; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 8);
            return tex;
        }

        const mats = {
            floor: new THREE.MeshLambertMaterial({ map: createGridTexture() }),
            wall: new THREE.MeshLambertMaterial({ color: 0x334155 }),
            obstacle: new THREE.MeshLambertMaterial({ color: 0xd97706 }),
            pillar: new THREE.MeshLambertMaterial({ color: 0x475569 })
        };

        const obstacles = [];

        function addBlock(x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); scene.add(mesh);
            obstacles.push(new THREE.Box3(new THREE.Vector3(x - w/2, y - h/2, z - d/2), new THREE.Vector3(x + w/2, y + h/2, z + d/2)));
        }

        addBlock(0, -0.5, 0, 20, 1, 20, mats.floor);
        addBlock(0, 15.5, 0, 20, 1, 20, mats.wall);
        addBlock(0, 7.5, -10.5, 21, 15, 1, mats.wall);
        addBlock(0, 7.5, 10.5, 21, 15, 1, mats.wall);
        addBlock(-10.5, 7.5, 0, 1, 15, 21, mats.wall);
        addBlock(10.5, 7.5, 0, 1, 15, 21, mats.wall);

        addBlock(0, 7.5, 0, 2, 15, 2, mats.pillar);
        addBlock(-5, 1.5, -5, 3, 3, 3, mats.obstacle);
        addBlock(5, 2.5, 5, 4, 5, 2, mats.obstacle);
        addBlock(-6, 4, 4, 2, 8, 2, mats.obstacle);

        // ==========================================
        // 3. FULL BODY + LEGS AVATAR HIERARCHY
        // ==========================================
        const avatarGroup = new THREE.Group();
        const avatarMaterial = new THREE.MeshLambertMaterial({ color: myColor });
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.3), avatarMaterial);
        torso.position.set(0, 0.35, 0);
        avatarGroup.add(torso);

        const legGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.7);
        const leftLeg = new THREE.Mesh(legGeo, avatarMaterial);
        leftLeg.position.set(-0.12, -0.15, 0);
        const rightLeg = new THREE.Mesh(legGeo, avatarMaterial);
        rightLeg.position.set(0.12, -0.15, 0);
        avatarGroup.add(leftLeg, rightLeg);

        const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.0);
        armGeo.rotateX(Math.PI / 2);
        const leftArm = new THREE.Mesh(armGeo, avatarMaterial);
        const rightArm = new THREE.Mesh(armGeo, avatarMaterial);
        avatarGroup.add(leftArm, rightArm);

        const handGeo = new THREE.BoxGeometry(0.12, 0.06, 0.14);
        const leftHand = new THREE.Mesh(handGeo, avatarMaterial);
        const rightHand = new THREE.Mesh(handGeo, avatarMaterial);
        avatarGroup.add(leftHand, rightHand);

        playerRig.add(avatarGroup);

        const controller1 = renderer.xr.getController(0); 
        const controller2 = renderer.xr.getController(1);
        playerRig.add(controller1, controller2);

        // ==========================================
        // 4. UI & START FLOW
        // ==========================================
        document.getElementById('btnStart').onclick = () => {
            myColor = document.getElementById('playerColor').value;
            avatarMaterial.color.set(myColor);
            document.body.classList.add('started');
            document.getElementById('menu').style.display = 'none';
        };

        // ==========================================
        // 5. MOVEMENT & FULL BODY LOOP
        // ==========================================
        const prevLocal1 = new THREE.Vector3(); 
        const prevLocal2 = new THREE.Vector3();
        const clock = new THREE.Clock();

        function processMovement(ctrl, prevPos) {
            const currPos = ctrl.position.clone();
            if (prevPos.lengthSq() > 0) {
                const deltaLocal = new THREE.Vector3().subVectors(currPos, prevPos);
                if (deltaLocal.lengthSq() > 0.000001) {
                    const handWorld = new THREE.Vector3();
                    ctrl.getWorldPosition(handWorld);

                    let touch = (handWorld.y <= 0.35);
                    if (!touch) {
                        for (let i = 0; i < obstacles.length; i++) {
                            if (obstacles[i].containsPoint(handWorld)) {
                                touch = true; break;
                            }
                        }
                    }

                    if (touch) {
                        const deltaWorld = deltaLocal.clone().applyQuaternion(playerRig.quaternion);
                        playerVel.addScaledVector(deltaWorld, -35.0);
                    }
                }
            }
            prevPos.copy(currPos);
        }

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.05);

            if (renderer.xr.isPresenting) {
                processMovement(controller1, prevLocal1);
                processMovement(controller2, prevLocal2);
            }

            playerVel.y -= 12.0 * dt; 
            playerVel.multiplyScalar(0.97);

            playerPos.addScaledVector(playerVel, dt);

            if (playerPos.y < playerRadius) {
                playerPos.y = playerRadius;
                if (playerVel.y < 0) playerVel.y = 0;
            }

            playerRig.position.set(
                playerPos.x - camera.position.x,
                playerPos.y - playerRadius,
                playerPos.z - camera.position.z
            );

            leftHand.position.copy(controller1.position);
            leftHand.quaternion.copy(controller1.quaternion);
            rightHand.position.copy(controller2.position);
            rightHand.quaternion.copy(controller2.quaternion);

            const torsoWorldPos = new THREE.Vector3(playerPos.x, playerPos.y + 0.35, playerPos.z);
            
            if (controller1.position.lengthSq() > 0.01) {
                leftArm.position.copy(torsoWorldPos).add(controller1.position).multiplyScalar(0.5);
                leftArm.lookAt(controller1.position);
                leftArm.scale.set(1, 1, torsoWorldPos.distanceTo(controller1.position));
            }
            if (controller2.position.lengthSq() > 0.01) {
                rightArm.position.copy(torsoWorldPos).add(controller2.position).multiplyScalar(0.5);
                rightArm.lookAt(controller2.position);
                rightArm.scale.set(1, 1, torsoWorldPos.distanceTo(controller2.position));
            }

            const camEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
            torso.rotation.y = camEuler.y;
            leftLeg.rotation.y = camEuler.y;
            rightLeg.rotation.y = camEuler.y;

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
